  {
    const sz=160,c=mkCanvas(sz,sz),g=c.getContext("2d"),r=sz/2;
    g.save();
    g.beginPath(); g.arc(r,r,r*.97,0,TAU); g.clip();
    const og=g.createRadialGradient(r*.72,r*.66,r*.12,r,r,r*1.05);
    og.addColorStop(0,"#8fd0ff"); og.addColorStop(.4,"#3487d8");
    og.addColorStop(.75,"#1d569f"); og.addColorStop(1,"#123a74");
    g.fillStyle=og; g.fillRect(0,0,sz,sz);
    const rnd=mulberry32(0xEA47);
    /* continents: clustered soft blobs, low contrast like from orbit */
    for(let k=0;k<7;k++){
      const cx=r+(rnd()-.5)*sz*.72, cy=r+(rnd()-.5)*sz*.72;
      const col=rnd()<.6?"rgba(110,158,92,.55)":"rgba(158,146,96,.45)";
      g.fillStyle=col;
      for(let b=0;b<6;b++){
        const bx=cx+(rnd()-.5)*sz*.16, by=cy+(rnd()-.5)*sz*.13;
        const br=sz*(.03+rnd()*.055);
        g.beginPath(); g.ellipse(bx,by,br*(1.2+rnd()),br,rnd()*TAU,0,TAU); g.fill();
      }
    }
    /* polar ice */
    g.fillStyle="rgba(235,245,255,.85)";
    g.beginPath(); g.ellipse(r,r*.14,r*.55,r*.16,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(r,sz-r*.12,r*.5,r*.14,0,0,TAU); g.fill();
    /* cloud swirls: elongated soft streaks at varied angles */
    for(let k=0;k<20;k++){
      const cx=r+(rnd()-.5)*sz*.8, cy=r+(rnd()-.5)*sz*.8;
      const ln=sz*(.10+rnd()*.22), th=sz*(.02+rnd()*.03);
      g.save();
      g.translate(cx,cy); g.rotate(rnd()*TAU);
      g.globalAlpha=.20+rnd()*.30;
      g.drawImage(SPR.soft,-ln/2,-th/2,ln,th);
      g.restore();
    }
    g.restore();
    SPR.earth=c;
  }
}
buildSprites();

/* --- the aurora ray sprite: 12 colour-mix buckets ---------------
   Each is a tall vertical strip, brightest at the BOTTOM (100 km base),
   fading upward, with red creeping into the top and purple into the
   very bottom edge as the bucket index rises.                      */
const RAY_BUCKETS=12, RAY_W=16, RAY_H=256;
let raySprites=[], raySpritesKey="";
function buildRaySprites(force){
  const key=[P.green.map(Math.round),P.red.map(Math.round),P.purple.map(Math.round),
             P.redAmt.toFixed(2),P.purpAmt.toFixed(2),S.boost].join("|");
  if(!force && key===raySpritesKey) return;
  raySpritesKey=key;
  const boost=1+S.boost/100;
  const WHT=[255,255,255];
  /* three hue families along every curtain, like in real photographs:
     emerald, teal-cyan and spring yellow-green */
  const HUES=[P.green,
              mixRGB(P.green,[56,214,255],.52),
              mixRGB(P.green,[212,255,110],.42)];
  raySprites=[];
  for(let h=0;h<HUES.length;h++){
    const row=[];
    const G=HUES[h],R=P.red,U=P.purple;
    for(let b=0;b<RAY_BUCKETS;b++){
      const f=b/(RAY_BUCKETS-1);                    /* 0 quiet -> 1 extreme */
      const c=mkCanvas(RAY_W,RAY_H), g=c.getContext("2d");
      const grad=g.createLinearGradient(0,RAY_H,0,0); /* bottom -> top */
      const redMix=clamp(f*1.15,0,1)*P.redAmt;
      const purp=clamp((f-.38)/.62,0,1)*P.purpAmt*.55;
      const pink=mixRGB(U,[175,120,205],.55);
      const core=mixRGB(G,WHT,.34+f*.14);
      const bot=mixRGB(G,pink,purp*.85);
      grad.addColorStop(0,   rgb(bot,0));
      grad.addColorStop(.030,rgb(bot,clamp(.62*boost*(.35+.65*purp),0,1)));
      grad.addColorStop(.075,rgb(mixRGB(core,pink,purp*.30),clamp(.88*boost,0,1)));
      grad.addColorStop(.13, rgb(core,clamp(.86*boost,0,1)));
      grad.addColorStop(.25, rgb(mixRGB(G,WHT,.08),clamp(.72*boost,0,1)));
      grad.addColorStop(.45, rgb(mixRGB(G,R,redMix*.26),clamp(.40*boost,0,1)));
      grad.addColorStop(.62, rgb(mixRGB(G,R,redMix*.50),clamp(.22*boost,0,1)));
      grad.addColorStop(.78, rgb(mixRGB(G,R,redMix*.78),clamp(.11*boost,0,1)));
      grad.addColorStop(.92, rgb(mixRGB(G,R,redMix*.95),clamp(.045*boost,0,1)));
      grad.addColorStop(1,   rgb(mixRGB(G,R,redMix),0));
      g.fillStyle=grad; g.fillRect(0,0,RAY_W,RAY_H);
      /* feather the sides strongly so neighbours fuse into soft folds */
      const side=g.createLinearGradient(0,0,RAY_W,0);
      side.addColorStop(0,"rgba(0,0,0,1)"); side.addColorStop(.32,"rgba(0,0,0,.25)");
      side.addColorStop(.5,"rgba(0,0,0,0)"); side.addColorStop(.68,"rgba(0,0,0,.25)");
      side.addColorStop(1,"rgba(0,0,0,1)");
      g.globalCompositeOperation="destination-out";
      g.fillStyle=side; g.fillRect(0,0,RAY_W,RAY_H);
      row.push(c);
    }
    raySprites.push(row);
  }
}
buildRaySprites(true);

/* ---------------------------------------------------------------
   6. THE SIMULATION — one state machine, two windows onto it
   --------------------------------------------------------------- */
const PHASE={QUIET:0,ERUPTION:1,TRANSIT:2,IMPACT:3,STORM:4};
const sim={
  t:0,
  phase:PHASE.QUIET,
  phaseT:0,
  cme:null,                 /* {p:0..1, travel, strength, y} */
  compress:0,               /* 0..1 dayside compression */
  tailStretch:0,
  precip:REDUCED?.42:.12,   /* live precipitation rate, drives the sky */
  precipTarget:.12,
  windFlux:.35,
  effKp:S.kp,
  nextAuto:0,
  flashes:[],               /* cusp flashes {x,y,t,life,pole} */
  surgeQueue:0,
  impactSeen:!!localStorage.getItem("aurora.capSeen"),
  lastImpact:-999
};
sim.nextAuto=REDUCED?1e9:(38+mulberry32(SEED^7)()*40);

function launchCME(strength){
  if(sim.cme) return;
  const rnd=mulberry32(SEED ^ (sim.t*1000|0) ^ 0x9e37);
  const st=strength!==undefined?strength:clamp(.35+S.kp/9*.65+rnd()*.25,.2,1);
  sim.cme={p:0, travel:lerp(14,6,st), strength:st, y:(rnd()-.5)*.18, born:sim.t, shock:0};
  sim.phase=PHASE.ERUPTION; sim.phaseT=0;
  toast(T("tCME"));
  Audio.eruption(st);
}
function stepSim(dt){
  sim.t+=dt;
  sim.phaseT+=dt;
  const base=S.kp/9;
  /* baseline precipitation from Kp alone — Kp 9 must burn even between storms */
  const bp=.05+Math.pow(base,1.2)*.72;

  switch(sim.phase){
    case PHASE.QUIET:
      sim.compress=lerp(sim.compress,0,1-Math.pow(.001,dt));
      sim.tailStretch=lerp(sim.tailStretch,0,1-Math.pow(.001,dt));
      sim.precipTarget=bp;
      sim.windFlux=.28+base*.3;
      if(S.auto && !REDUCED){
        sim.nextAuto-=dt;
        if(sim.nextAuto<=0){ launchCME(); sim.nextAuto=40+mulberry32(SEED^(sim.t|0))()*50; }
      }
      break;

    case PHASE.ERUPTION:
      sim.precipTarget=bp;
      sim.windFlux=lerp(sim.windFlux,.4+sim.cme.strength*.3,dt*1.6);
      if(sim.phaseT>1.6){ sim.phase=PHASE.TRANSIT; sim.phaseT=0; }
      break;

    case PHASE.TRANSIT:
      sim.cme.p+=dt/sim.cme.travel;
      sim.cme.shock=clamp(sim.cme.p*1.15,0,1);
      sim.windFlux=lerp(sim.windFlux,.45+sim.cme.strength*.35,dt*1.2);
      if(sim.cme.p>=1){ sim.phase=PHASE.IMPACT; sim.phaseT=0; onImpact(); }
      break;

    case PHASE.IMPACT:{
      const k=clamp(sim.phaseT/1.2,0,1);
      sim.compress=lerp(sim.compress,sim.cme.strength,1-Math.pow(.0005,dt));
      sim.tailStretch=lerp(sim.tailStretch,sim.cme.strength,1-Math.pow(.005,dt));
      sim.windFlux=.6+sim.cme.strength*.4;
      sim.precipTarget=lerp(.25,.6,k)*sim.cme.strength+bp*.8;
      if(sim.phaseT>1.6){ sim.phase=PHASE.STORM; sim.phaseT=0;
        sim.stormLen=lerp(30,90,sim.cme.strength); }
      break;}

    case PHASE.STORM:{
      const k=clamp(sim.phaseT/sim.stormLen,0,1);
      const decay=Math.pow(1-k,1.7);
      const st=sim.cme?sim.cme.strength:.6;
      sim.precipTarget=clamp(bp*.85+ (.3+st*.55)*decay ,0,1.15);
      sim.windFlux=.35+base*.25+(.35+st*.4)*decay;
      sim.compress=lerp(sim.compress,st*decay,1-Math.pow(.15,dt));
      sim.tailStretch=lerp(sim.tailStretch,st*decay,1-Math.pow(.2,dt));
      /* surges run along the curtains while the storm is alive */
      if(Math.random()<dt*(.05+ .1*decay*st)) sim.surgeQueue++;
      if(k>=1){ sim.phase=PHASE.QUIET; sim.phaseT=0; sim.cme=null;
        sim.nextAuto=40+mulberry32(SEED^(sim.t|0))()*50; }
      break;}
  }

  /* precipitation follows its target with a lag — the sky ignites ~2 s
     after the impact, not instantly */
  const rate = sim.precipTarget>sim.precip ? 1-Math.pow(.35,dt) : 1-Math.pow(.75,dt);
  sim.precip=lerp(sim.precip,sim.precipTarget,rate);
  sim.effKp=clamp(sim.precip*8.4+ .3,0,9);

  /* cusp flashes decay */
  for(let i=sim.flashes.length-1;i>=0;i--){
    const f=sim.flashes[i]; f.t+=dt;
    if(f.t>f.life) sim.flashes.splice(i,1);
  }
}
function onImpact(){
  sim.lastImpact=sim.t;
  toast(T("tImpact"));
  Audio.impact(sim.cme?sim.cme.strength:.6);
  sim.surgeQueue+=1;
  if(!sim.impactSeen){
    sim.impactSeen=true;
    localStorage.setItem("aurora.capSeen","1");
    showCaption(T("capImpact"),7000);
  }
}

/* ---------------------------------------------------------------
   7. SPACE VIEW — Sun, Earth, field lines, solar wind, cusps
   --------------------------------------------------------------- */
const space={
  sunX:0,sunY:0,sunR:0,earthX:0,earthY:0,earthR:0,
  driftT:0, camX:0, camY:0
};
/* --- field lines: precomputed dipole polylines, animated by offsets --- */
let fieldLines=[];
function buildFieldLines(){
  fieldLines=[];
  const Ls=[1.45,1.8,2.3,3.0,4.0,5.4,7.2];       /* L-shells */
  for(let i=0;i<Ls.length;i++){
    for(let side=0;side<2;side++){                /* 0 = dayside, 1 = nightside */
      const L=Ls[i], N=44;
      const pts=new Float32Array(N*2);
      const lam0=Math.acos(Math.sqrt(clamp(1/L,0,1)));
      for(let j=0;j<N;j++){
        const u=j/(N-1);
        const lam=lerp(lam0,-lam0,u);
        const r=L*Math.cos(lam)*Math.cos(lam);
        const x=r*Math.cos(lam)*(side?1:-1);      /* +x = anti-sunward (night) */
        const y=-r*Math.sin(lam);                 /* -y = north (screen up) */
        pts[j*2]=x; pts[j*2+1]=y;
      }
      fieldLines.push({pts,L,side,N,idx:i,flap:mulberry32(SEED^(i*31+side))()*TAU});
    }
  }
}
/* --- solar wind particles: flat typed array, stride 6 --------------- */
/* [x, y, vx, vy, mode, phase]   mode: 0 flow, 1 cusp-captured        */
const WIND_STRIDE=6;
let windN=0, wind=null, windCap=0;
function buildWind(){
  const target=isMobile?280:600;
  windCap=target;
  windN=Math.round(target*perf.windScale);
  wind=new Float32Array(windCap*WIND_STRIDE);
  const rnd=mulberry32(SEED^0x5150);
  for(let i=0;i<windCap;i++) spawnWind(i,rnd,true);
}
function spawnWind(i,rnd,anywhere){
  const o=i*WIND_STRIDE;
  const r=rnd||Math.random.bind(Math);
  const x=anywhere? r() : (r()*.08);
  wind[o]  = x;                      /* normalised 0..1 across the gap  */
  wind[o+1]= (r()-.5)*.95;           /* normalised vertical offset      */
  wind[o+2]= .055+r()*.05;           /* vx in normalised units / s      */
  wind[o+3]= (r()-.5)*.005;
  wind[o+4]= 0;
  wind[o+5]= r()*TAU;
}
function updateWind(dt){
  if(!wind) return;
  const ex=1.0;                       /* Earth sits at x = 1 in wind space */
  const flux=sim.windFlux;
  const standoff=.115*(1-sim.compress*.25);
  const cuspY=.052, cuspX=-.028;      /* cusp offsets from Earth (sunward, up/down) */
  for(let i=0;i<windN;i++){
    const o=i*WIND_STRIDE;
    let x=wind[o],y=wind[o+1],vx=wind[o+2],vy=wind[o+3];
    const mode=wind[o+4];
    if(mode===0){
      const dx=x-ex, dy=y;
      const d=Math.hypot(dx,dy)+1e-5;
      if(d<standoff*4.2 && dx<standoff*1.6){
        /* steer away from Earth: flow around the magnetopause */
        const push=(standoff*2.4/d)*(standoff*2.4/d)*1.25;
        vx+=(dx/d)*push*dt*1.5;
        vy+=(dy/d)*push*dt*4.2;
        /* a fraction get pulled toward a polar cusp */
        if(wind[o+5]<0.55 && d<standoff*1.9){
          const pole=y<0?-1:1;
          const cx=ex+cuspX, cy=pole*cuspY;
          const ax=cx-x, ay=cy-y, ad=Math.hypot(ax,ay)+1e-5;
          if(ad<standoff*1.5){ wind[o+4]=1; wind[o+5]=Math.atan2(y-cy,x-cx); }
          else { vx+=ax/ad*dt*.10; vy+=ay/ad*dt*.10; }
        }
      }
      /* gentle downstream reacceleration */
      vx+=(.055+flux*.06-vx)*dt*.6;
      x+=vx*dt*flux*3.2; y+=vy*dt*flux*3.2;
      wind[o]=x; wind[o+1]=y; wind[o+2]=vx; wind[o+3]=vy;
      if(x>1.85||Math.abs(y)>.95) spawnWind(i,null,false);
    }else{
      /* captured: tighten a helix down onto the pole */
      const pole=y<0?-1:1;
      const cx=ex+cuspX*.35, cy=pole*.030;
      let ang=wind[o+5], rad=Math.hypot(x-cx,y-cy);
      ang+=dt*(5.5+ (1-rad*24)*4);
      rad-=dt*rad*1.9;
      x=cx+Math.cos(ang)*rad; y=cy+Math.sin(ang)*rad*.55+pole*dt*.004;
      wind[o]=x; wind[o+1]=y; wind[o+5]=ang;
      if(rad<.006){
        sim.flashes.push({x:x,y:y,t:0,life:.55,pole:pole});
        if(sim.flashes.length>90) sim.flashes.shift();
        Audio.chime(sim.precip);
        spawnWind(i,null,false);
      }
    }
  }
}

function layoutSpace(){
  const z=S.zoom;
  /* keep the pair clear of the control panel on the right */
  const cx=W*(isMobile?.48:.42)+space.camX, cy=H*.5+space.camY;
  const span=Math.min(W*.74,H*1.25)*z;
  space.sunR=Math.max(22,span*.085);
  space.sunX=cx-span*.46; space.sunY=cy;
  space.earthX=cx+span*.40; space.earthY=cy;
  space.earthR=Math.max(6,span*.026);
}
/* wind-space (0..1 gap, y normalised by gap) → screen */
function wx(x){ return lerp(space.sunX+space.sunR*.9, space.earthX, x); }
function wgap(){ return space.earthX-(space.sunX+space.sunR*.9); }
function wy(y){ return space.earthY + y*wgap()*.42; }

function drawSpace(alpha,zoomExtra){
  layoutSpace();
  ctx.save();
  ctx.globalAlpha=alpha;
  if(zoomExtra!==1){
    ctx.translate(W/2,H/2); ctx.scale(zoomExtra,zoomExtra); ctx.translate(-W/2,-H/2);
  }
  /* background: deep space with a faint heliospheric wash */
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,rgb(P.sky0,1)); bg.addColorStop(1,"rgb(2,3,7)");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawSpaceStars();

  ctx.globalCompositeOperation="lighter";
  drawSun();
  ctx.globalCompositeOperation="source-over";

  if(S.field) drawFieldLines();
  drawEarth();
  ctx.globalCompositeOperation="lighter";
  if(S.flow) drawWind();
  drawCusps();
  if(sim.cme) drawCME();
  ctx.globalCompositeOperation="source-over";
  if(S.labels) drawSpaceLabels();
  ctx.restore();
}

/* a handful of distant stars for the space view (drawn from the seed) */
let spaceStars=null;
function drawSpaceStars(){
  const base=ctx.globalAlpha;
  if(!spaceStars){
    const rnd=mulberry32(SEED^0xbeef), n=160;
    spaceStars=new Float32Array(n*3);
    for(let i=0;i<n;i++){ spaceStars[i*3]=rnd(); spaceStars[i*3+1]=rnd(); spaceStars[i*3+2]=.2+rnd()*.6; }
  }
  ctx.fillStyle="#fff";
  for(let i=0;i<spaceStars.length/3;i++){
    const a=spaceStars[i*3+2]*.55;
    ctx.globalAlpha=a*base;
    ctx.fillRect(spaceStars[i*3]*W,spaceStars[i*3+1]*H,1.1,1.1);
  }
  ctx.globalAlpha=base;
}

function drawSun(){
  const x=space.sunX,y=space.sunY,r=space.sunR;
  const breathe=1+Math.sin(sim.t*.34)*.035+Math.sin(sim.t*.13+1.7)*.02;
  const act=.85+sim.windFlux*.6;
  /* corona halo */
  let s=SPR.sunHalo, hr=r*7.2*breathe;
  ctx.globalAlpha=.55*act;
  ctx.drawImage(s,x-hr/2,y-hr/2,hr,hr);
  hr=r*4.1*breathe; ctx.globalAlpha=.7*act;
  ctx.drawImage(s,x-hr/2,y-hr/2,hr,hr);
  /* core */
  ctx.globalAlpha=1;
  const cr=r*2.3;
  ctx.drawImage(SPR.sunCore,x-cr/2,y-cr/2,cr,cr);
  /* drifting surface speckles */
  const rnd=mulberry32(SEED^0x50a);
  ctx.globalAlpha=.5;
  for(let i=0;i<26;i++){
    const a=rnd()*TAU + sim.t*(.03+rnd()*.05);
    const rr=Math.sqrt(rnd())*r*.92;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*.98;
    const sz=r*(.06+rnd()*.10);
    ctx.globalAlpha=.10+.16*(.5+.5*Math.sin(sim.t*.9+i));
    ctx.drawImage(SPR.soft,px-sz,py-sz,sz*2,sz*2);
  }
  /* plasma jets breathing out of the limb — no drawn arcs, just light */
  ctx.globalAlpha=1;
  for(let i=0;i<4;i++){
    const ph=(sim.t*.07+i*.29)%1;
    const life=Math.sin(ph*Math.PI);
    if(life<=0) continue;
    const a=i*1.83+Math.sin(sim.t*.05+i)*0.5;
    const jr=r*(.55+.5*life);
    const bx=x+Math.cos(a)*r*.94, by=y+Math.sin(a)*r*.94;
    ctx.save();
    ctx.translate(bx,by); ctx.rotate(a);
    ctx.globalAlpha=.22*life;
    ctx.drawImage(tintSprite(SPR.streak,[255,168,84]),-jr*.15,-r*.10,jr,r*.20);
    ctx.globalAlpha=.30*life;
    const ps=r*(.28+.3*life);
    ctx.drawImage(tintSprite(SPR.soft,[255,150,70]),jr*.55-ps,-ps,ps*2,ps*2);
    ctx.restore();
  }
  /* eruption: a fan of plasma bursting off the limb toward Earth */
  if(sim.phase===PHASE.ERUPTION && sim.cme){
    const k=clamp(sim.phaseT/1.6,0,1);
    const life=Math.sin(k*Math.PI);
    const ey=y+sim.cme.y*wgap()*.42;
    ctx.globalAlpha=life*.9;
    const fr=r*(1.6+k*2.2);
    ctx.drawImage(SPR.sunHalo,x+r*.6-fr/2,ey-fr/2,fr,fr);
    /* streaks fanning outward, lengthening as the burst grows */
    const n=7;
    for(let i=0;i<n;i++){
      const ang=(i/(n-1)-.5)*1.15+Math.atan2(ey-y,r*2)*.3;
      const ln=r*(1.2+k*2.6)*(.7+.3*Math.sin(i*2.7));
      ctx.save();
      ctx.translate(x+r*.82,ey); ctx.rotate(ang);
      ctx.globalAlpha=life*(.24+.12*Math.sin(i*1.9+sim.t*3));
      ctx.drawImage(tintSprite(SPR.streak,[255,214,150]),0,-r*.09,ln,r*.18);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}

function drawEarth(){
  const x=space.earthX,y=space.earthY,r=space.earthR;
  /* atmosphere glow */
  ctx.globalCompositeOperation="lighter";
  const ar=r*7;
  ctx.globalAlpha=.30;
  ctx.drawImage(tintSprite(SPR.soft,[120,190,255]),x-ar/2,y-ar/2,ar,ar);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
  /* the blue marble, slowly turning */
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(sim.t*.02);
  ctx.drawImage(SPR.earth,-r,-r,r*2,r*2);
  ctx.restore();
  /* night falls on the anti-sunward side — shading stays sun-fixed */
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r*.985,0,TAU); ctx.clip();
  const ng=ctx.createLinearGradient(x-r,y,x+r,y);
  ng.addColorStop(0,"rgba(4,8,18,0)");
  ng.addColorStop(.45,"rgba(4,8,18,0)");
  ng.addColorStop(.72,"rgba(4,8,18,.55)");
  ng.addColorStop(1,"rgba(3,6,14,.94)");
  ctx.fillStyle=ng; ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.restore();
  /* thin bright limb on the day side */
  const lg=ctx.createLinearGradient(x-r,y,x+r,y);
  lg.addColorStop(0,"rgba(170,220,255,.5)");
  lg.addColorStop(.55,"rgba(170,220,255,.12)");
  lg.addColorStop(1,"rgba(170,220,255,0)");
  ctx.strokeStyle=lg;
  ctx.lineWidth=Math.max(.6,r*.08);
  ctx.beginPath(); ctx.arc(x,y,r*1.03,0,TAU); ctx.stroke();
}

function drawFieldLines(){
  const x0=space.earthX,y0=space.earthY,R=space.earthR;
  const comp=sim.compress, stretch=sim.tailStretch;
  const ripple=(sim.t-sim.lastImpact);
  ctx.lineCap="round";
  for(let i=0;i<fieldLines.length;i++){
    const fl=fieldLines[i], N=fl.N, pts=fl.pts;
    const dayComp=fl.side?0:comp*.25*clamp(fl.L/5,.35,1);
    const tail=fl.side? 1+stretch*1.9*clamp((fl.L-1.6)/5,0,1) : 1;
    const flapA=fl.side? (.06+stretch*.22)*R*clamp((fl.L-2)/5,0,1) : 0;
    /* the field is never still: each shell breathes and its glow pulses */
    const breathe=1+Math.sin(sim.t*.42+fl.idx*.9+fl.flap)*.016;
    const pulse=.85+.15*Math.sin(sim.t*.7+fl.idx*1.3+fl.side*2.1);
    const glow=(.15+ (fl.side?.06:.10)*(1-dayComp) + sim.precip*.24)*pulse;
    ctx.beginPath();
    for(let j=0;j<N;j++){
      const u=j/(N-1);
      let px=pts[j*2], py=pts[j*2+1];
      px*= tail*(1-dayComp)*breathe;
      py*= (1-dayComp*.55)*breathe;
      let sx=x0+px*R, sy=y0+py*R;
      /* a slow wave travels along every line, day and night side alike */
      sy+=Math.sin(u*4.6+sim.t*(.55+fl.idx*.11)+fl.flap)*R*.055*
          (fl.side?1.3:.7)*clamp(fl.L/5,.4,1);
      if(flapA){
        sy+=Math.sin(px*.55 - sim.t*1.15 + fl.flap)*flapA*clamp(px/6,0,1);
      }
      /* pressure ripple running outward after an impact */
      if(ripple<2.4 && ripple>0){
        const d=Math.hypot(px,py);
        const w=Math.exp(-Math.pow(d-ripple*7.5,2)*.09);
        sy+=w*R*.55*Math.sign(py||1);
      }
      j?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
    }
    ctx.strokeStyle=`rgba(140,200,255,${glow})`;
    ctx.lineWidth=Math.max(.7,R*.13);
    ctx.stroke();
  }
  /* magnetopause / bow shock arc on the dayside */
  const so=R*(7.2-comp*1.8);
  ctx.strokeStyle=`rgba(120,190,255,${.14+comp*.20})`;
  ctx.lineWidth=Math.max(1,R*.16);
  ctx.beginPath();
  for(let a=-1.35;a<=1.35;a+=.06){
    const rr=so*(1.0/(1+.35*Math.abs(a)));
    const px=x0-Math.cos(a)*rr, py=y0+Math.sin(a)*rr*1.35;
    a===-1.35?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
}

function drawWind(){
  if(!wind) return;
  const gap=wgap();
  const size=Math.max(.8,space.earthR*.10);
  const baseTr=ctx.getTransform();
  for(let i=0;i<windN;i++){
    const o=i*WIND_STRIDE;
    const x=wx(wind[o]), y=wy(wind[o+1]);
    if(x<-40||x>W+40||y<-40||y>H+40) continue;
    const capt=wind[o+4]===1;
    if(capt){
      /* captured particles glow as they spiral into the cusp */
      const s=size*3.2;
      ctx.globalAlpha=.9;
      ctx.drawImage(tintSprite(SPR.dot,P.green),x-s,y-s,s*2,s*2);
    }else{
      /* a tapering light streak along the velocity — overlapping tails
         fuse into a continuous stream instead of reading as fragments */
      const vx=wind[o+2], vy=wind[o+3];
      const sp=Math.hypot(vx,vy);
      const len=clamp(sp*gap*(.55+sim.windFlux*.4),10,gap*.055);
      const th=Math.max(1.4,size*1.6);
      ctx.globalAlpha=.10+sim.windFlux*.16;
      ctx.translate(x,y);
      ctx.rotate(Math.atan2(vy,vx));
      ctx.drawImage(SPR.streak,-len,-th/2,len,th);
      ctx.setTransform(baseTr);
    }
  }
  ctx.globalAlpha=1;
}

function drawCusps(){
  const x=space.earthX,y=space.earthY,R=space.earthR;
  const p=sim.precip;
  /* the auroral oval: a glowing ring near each pole, widening equatorward */
  for(const pole of [-1,1]){
    const spread=lerp(.35,1.15,clamp(p,0,1));
    const ry=R*(.55+spread*.55), rx=R*(1.02+spread*.18);
    ctx.globalAlpha=clamp(.18+p*.7,0,.95);
    ctx.strokeStyle=rgb(P.green,1);
    ctx.lineWidth=Math.max(1.1,R*(.14+p*.22));
    ctx.beginPath();
    ctx.ellipse(x,y+pole*R*.72,rx*.55,ry*.30,0,0,TAU);
    ctx.stroke();
    const gr=R*(4+p*5);
    ctx.globalAlpha=clamp(.10+p*.42,0,.8);
    ctx.drawImage(tintSprite(SPR.soft,P.green),x-gr/2,y+pole*R*.85-gr/2,gr,gr);
  }
  /* flashes where particles hit the atmosphere */
  for(const f of sim.flashes){
    const k=1-f.t/f.life;
    const px=wx(f.x), py=wy(f.y);
    const s=R*(1.2+ (1-k)*3.2);
    ctx.globalAlpha=k*.75;
    ctx.drawImage(tintSprite(SPR.dot,P.green),px-s,py-s,s*2,s*2);
  }
  ctx.globalAlpha=1;
}

/* tiny tinted-sprite cache so we never build gradients per frame */
const tintCache=new Map();
function tintSprite(src,col){
  const key=src.width+"x"+src.height+":"+(col[0]|0)+","+(col[1]|0)+","+(col[2]|0);
  let c=tintCache.get(key);
  if(c) return c;
  c=mkCanvas(src.width,src.height);
  const g=c.getContext("2d");
  g.drawImage(src,0,0);
  g.globalCompositeOperation="source-in";
  g.fillStyle=rgb(col,1); g.fillRect(0,0,c.width,c.height);
  if(tintCache.size>40) tintCache.clear();
  tintCache.set(key,c);
  return c;
}

function drawCME(){
  const c=sim.cme;
  const p=(sim.phase===PHASE.ERUPTION)? clamp(sim.phaseT/1.6,0,1)*.05 : c.p;
  const x=wx(clamp(p,0,1)), y=wy(c.y*(1-p*.6));
  const R=wgap()*(.035+.055*c.strength)*(1+p*1.5);
  /* the compressed sheath ahead of the cloud — soft glow, no line */
  if(p>.03){
    const fade=(1-clamp((p-.9)/.1,0,1)*.6);
    const m=9;
    for(let i=0;i<m;i++){
      const a=(i/(m-1)-.5)*2.0;
      const rr=R*(1.02-.18*Math.abs(a));
      const px=x+R*.42+Math.cos(a)*rr*.5, py=y+Math.sin(a)*rr*1.15;
      const ss=R*(.30+.12*Math.cos(a*2));
      ctx.globalAlpha=(.05+c.strength*.07)*fade*(1-Math.abs(a)*.35);
      ctx.drawImage(tintSprite(SPR.soft,[255,206,160]),px-ss,py-ss,ss*2,ss*2);
    }
  }
  /* the cloud itself */
  const rnd=mulberry32(SEED^0xc3e);
  const n=isMobile?26:44;
  for(let i=0;i<n;i++){
    const a=rnd()*TAU, rr=Math.pow(rnd(),.6)*R;
    const wob=Math.sin(sim.t*1.7+i)*R*.09;
    const px=x+Math.cos(a)*rr*1.15+wob, py=y+Math.sin(a)*rr*.9;
    const s=R*(.16+rnd()*.26);
    ctx.globalAlpha=(.10+.22*rnd())*(1-p*.25);
    ctx.drawImage(tintSprite(SPR.soft,[255,196,142]),px-s,py-s,s*2,s*2);
  }
  ctx.globalAlpha=clamp(.35*(1-p*.4),0,.6);
  const hr=R*3.2;
  ctx.drawImage(SPR.sunHalo,x-hr/2,y-hr/2,hr,hr);
  ctx.globalAlpha=1;
}

function spaceLabel(text,x,y,align,alpha){
  ctx.globalAlpha=alpha;
  ctx.font="500 11px ui-sans-serif,system-ui,sans-serif";
  ctx.textAlign=align||"center";
  ctx.textBaseline="middle";
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillText(text,x+1,y+1);
  ctx.fillStyle="rgba(226,238,255,.86)";
  ctx.fillText(text,x,y);
  ctx.textAlign="left";
  ctx.globalAlpha=1;
}
function drawSpaceLabels(){
  const a=labelFade;
  if(a<=0.01) return;
  const R=space.earthR;
  spaceLabel(T("lblSun"),space.sunX,space.sunY+space.sunR*2.4,"center",a*.9);
  spaceLabel(T("lblEarth"),space.earthX,space.earthY-R*4.6,"center",a*.9);
  spaceLabel(T("lblShock"),space.earthX-R*8.6,space.earthY-R*3.2,"right",a);
  spaceLabel(T("lblTail"),space.earthX+R*2.2,space.earthY+R*9.2,"left",a);
  spaceLabel(T("lblCusp"),space.earthX-R*2.6,space.earthY-R*3.0,"right",a);
  spaceLabel(T("lblOval"),space.earthX+R*2.8,space.earthY+R*2.6,"left",a);
  spaceLabel(T("lblWind"),wx(.28),wy(-.55),"center",a*.75);
  if(sim.cme && sim.phase!==PHASE.QUIET){
    const p=sim.phase===PHASE.ERUPTION?.05:sim.cme.p;
    spaceLabel(T("lblCME"),wx(clamp(p,0,1)),wy(sim.cme.y*(1-p*.6))-wgap()*.10,"center",a);
  }
}

/* ---------------------------------------------------------------
   8. SKY VIEW — starfield, curtains, landscape, lake, snow
   --------------------------------------------------------------- */

/* --- static seeded starfield with a Milky Way band, own layer ------ */
let starCv=null;
function buildStarLayer(){
  const w=Math.ceil(W), h=Math.ceil(H*1.25);
  starCv=mkCanvas(w*DPR,h*DPR);
  const g=starCv.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,w,h);
  const rnd=mulberry32(SEED^0x57a2);
  /* Milky Way: a soft diagonal band of many faint dots */
  const bandA=-0.42+(mulberry32(SEED^0x991)()-.5)*.18, bx=w*.62, by=h*.30;
  const mwN=Math.round(1400*(S.stars/100));
  for(let i=0;i<mwN;i++){
    const u=(rnd()*2-1), v=(rnd()+rnd()+rnd()-1.5)/1.5;
    const L=u*w*1.1, off=v*h*.17;
    const x=bx+Math.cos(bandA)*L-Math.sin(bandA)*off;
    const y=by+Math.sin(bandA)*L+Math.cos(bandA)*off;
    if(x<0||x>w||y<0||y>h) continue;
    const a=(1-Math.abs(v))*.30*rnd();
    g.fillStyle=`rgba(${P.star[0]|0},${P.star[1]|0},${P.star[2]|0},${a.toFixed(3)})`;
    g.fillRect(x,y,1,1);
  }
  /* the band's diffuse glow */
  g.save();
  g.translate(bx,by); g.rotate(bandA);
  const grd=g.createLinearGradient(0,-h*.19,0,h*.19);
  grd.addColorStop(0,"rgba(150,175,225,0)");
  grd.addColorStop(.5,"rgba(160,185,235,.055)");
  grd.addColorStop(1,"rgba(150,175,225,0)");
  g.fillStyle=grd; g.fillRect(-w*1.2,-h*.19,w*2.4,h*.38);
  g.restore();
  /* the stars themselves */
  const n=Math.round((isMobile?420:900)*(S.stars/100));
  for(let i=0;i<n;i++){
    const x=rnd()*w, y=Math.pow(rnd(),1.25)*h;
    const m=Math.pow(rnd(),2.6);
    const r=.4+m*1.5;
    const a=.22+m*.78;
    g.fillStyle=`rgba(${P.star[0]|0},${P.star[1]|0},${P.star[2]|0},${a.toFixed(3)})`;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    if(m>.86){
      g.globalAlpha=a*.30;
      g.drawImage(SPR.soft,x-r*3.4,y-r*3.4,r*6.8,r*6.8);
      g.globalAlpha=1;
    }
  }
}

/* --- the winter panorama, baked once per resize ------------------- */
let landCv=null, horizonY=0, lakeTop=0, lakeBottom=0, snowCrestY=0;
function buildLandscape(){
  horizonY=Math.round(H*(isPortrait?.60:.58));
  lakeTop=horizonY+Math.round(H*(isPortrait?.18:.22));
  lakeBottom=H;
  landCv=mkCanvas(W*DPR,(lakeTop-horizonY+2)*DPR);
  const g=landCv.getContext("2d");
  g.setTransform(DPR,0,0,DPR,0,0);
  const h=lakeTop-horizonY+2;
  const rnd=mulberry32(SEED^0x1a4d);
  const noise=makeNoise(SEED^0x77);

  /* far hills → near hills, each a filled polyline */
  const bands=[
    {amp:.16,base:.10,col:"#0b1220",tree:0},
    {amp:.22,base:.20,col:"#080e19",tree:1},
    {amp:.30,base:.34,col:"#050911",tree:1}
  ];
  landCv._crest=[];
  for(let b=0;b<bands.length;b++){
    const B=bands[b];
    const yBase=h*B.base;
    g.beginPath();
    g.moveTo(0,h);
    const seedOff=b*17.3;
    const crest=[];
    for(let x=0;x<=W;x+=4){
      const u=x/W;
      const y=yBase - (noise(u*3.1+seedOff)*.5+noise(u*7.7+seedOff)*.28+noise(u*15.3+seedOff)*.12)*h*B.amp;
      crest.push(y);
      g.lineTo(x,y);
    }
    g.lineTo(W,h); g.closePath();
    g.fillStyle=B.col; g.fill();
    /* snow crest highlight (tinted live later by an overlay) */
    g.beginPath();
    for(let i=0;i<crest.length;i++){ const x=i*4; i?g.lineTo(x,crest[i]):g.moveTo(x,crest[i]); }
    g.strokeStyle=`rgba(${P.snow[0]|0},${P.snow[1]|0},${P.snow[2]|0},${.10+b*.05})`;
    g.lineWidth=1.6; g.stroke();
    if(b===bands.length-1) landCv._crest=crest;

    /* spruce treeline on the two nearer bands */
    if(B.tree){
      const count=Math.round(W/(b===1?26:17));
      for(let i=0;i<count;i++){
        const x=rnd()*W;
        const ci=clamp(Math.round(x/4),0,crest.length-1);
        const gy=crest[ci]+2;
        const th=h*(b===1?.055:.10)*(.55+rnd()*.85);
        const tw=th*(.28+rnd()*.12);
        g.fillStyle=b===1?"#050a13":"#02050b";
        g.beginPath();
        const tiers=4;
        for(let t=0;t<tiers;t++){
          const f=t/tiers;
          const ty=gy-th*(1-f);
          const w2=tw*(0.30+f*0.85);
          g.moveTo(x,ty-th*.30);
          g.lineTo(x-w2,ty+th*.06);
          g.lineTo(x+w2,ty+th*.06);
        }
        g.closePath(); g.fill();
        g.fillRect(x-tw*.06,gy-th*.12,tw*.12,th*.12);
      }
    }
  }
  /* one small cabin with a warm lit window */
  {
    const crest=landCv._crest;
    const cx=W*(.16+mulberry32(SEED^0x9)()*.12);   /* left third: eye path cabin->lake->aurora */
    const ci=clamp(Math.round(cx/4),0,crest.length-1);
    const gy=crest[ci]+h*.055;
    const cw=Math.max(26,h*.13), ch=cw*.62;
    g.fillStyle="#04080f";
    g.fillRect(cx-cw/2,gy-ch,cw,ch);
    g.beginPath();
    g.moveTo(cx-cw*.62,gy-ch); g.lineTo(cx,gy-ch-cw*.42); g.lineTo(cx+cw*.62,gy-ch);
    g.closePath(); g.fill();
    /* snow on the roof */
    g.strokeStyle=`rgba(${P.snow[0]|0},${P.snow[1]|0},${P.snow[2]|0},.22)`;
    g.lineWidth=2;
    g.beginPath();
    g.moveTo(cx-cw*.62,gy-ch); g.lineTo(cx,gy-ch-cw*.42); g.lineTo(cx+cw*.62,gy-ch);
    g.stroke();
    landCv._cabin={x:cx,y:gy-ch+ch*.34,w:cw*.20,h:ch*.26};
  }
}

/* --- curtains ----------------------------------------------------- */
let curtains=[];
function buildCurtains(){
  curtains=[];
  const rnd=mulberry32(SEED^0xa0a0);
  /* 7 logical layers: 2 faint background curtains, 2 medium, 2 strong,
     and 1 thin bright ribbon — tuned to read as ONE aurora system */
  const TYPES=[
    {kind:"curtain",depth:.98,thresh:.02},
    {kind:"curtain",depth:.84,thresh:.06},
    {kind:"curtain",depth:.62,thresh:.13},
    {kind:"curtain",depth:.46,thresh:.22},
    {kind:"curtain",depth:.24,thresh:.34},
    {kind:"curtain",depth:.06,thresh:.48},
    {kind:"ribbon", depth:.34,thresh:.30}
  ];
  for(let i=0;i<TYPES.length;i++){
    const T=TYPES[i];
    curtains.push({
      kind:T.kind,
      depth:clamp(T.depth+(rnd()-.5)*.06,0,1),
      thresh:T.thresh,
      rays:rayCountFor(T.kind),
      phase:rnd()*100,
      driftSpd:(.020+rnd()*.030)*(1-T.depth*.45)*(T.kind==="ribbon"?1.5:1),
      /* every layer lives on its own clock: big curtains drift slowly,
         near ones and the ribbon move faster (multi-scale dynamics) */
      tScale:.22+(1-T.depth)*.5+(T.kind==="ribbon"?.28:0),
      foldA:.6+rnd()*.9,
      yOff:(rnd()*.6-.1),
      widthSpan:(T.kind==="ribbon"?.85+rnd()*.35:1.1+rnd()*.55),
      xOff:(rnd()-.5)*.3+.10,           /* aurora weight sits right of centre */
      redSeed:rnd(),                     /* how much red this layer may carry */
      surge:-999,surgeSpd:0,surgeDir:1,
      n1:makeNoise(SEED^(0x300+i)),
      n2:makeNoise(SEED^(0x400+i)),
      n3:makeNoise(SEED^(0x500+i))
    });
  }
}
function rayCountFor(kind){
  const base=kind==="ribbon"?(isMobile?40:68):(isMobile?55:92);
  return Math.round(base*perf.rayScale*(kind==="ribbon"?perf.ribbonScale:1));
}
function retuneCurtains(){ for(const c of curtains) c.rays=rayCountFor(c.kind); }

/* offscreen curtain layer (also reused for the lake reflection) */
let curCv=null,curCtx=null,CUR_S=0.62,bloomCv=null,bloomCtx=null;
function sizeOffscreens(){
  const w=Math.max(2,Math.round(W*CUR_S)), h=Math.max(2,Math.round(H*CUR_S));
  curCv=mkCanvas(w,h); curCtx=curCv.getContext("2d");
  bloomCv=mkCanvas(Math.max(2,Math.round(W*.28)),Math.max(2,Math.round(H*.28)));
  bloomCtx=bloomCv.getContext("2d");
}

function drawCurtains(g,sc,pitchPx){
  const p=clamp(sim.precip,0,1.15);
  const gw=W*sc, gh=H*sc;
  /* Kp drives GEOMETRY, not just brightness: span, height, motion speed */
  const kpn=clamp(Math.max(S.kp/9,sim.effKp/9),0,1);
  g.globalCompositeOperation="lighter";
  for(let ci=0;ci<curtains.length;ci++){
    const c=curtains[ci];
    const isRibbon=c.kind==="ribbon";
    if(isRibbon && perf.ribbonScale<=0) continue;
    const depth=c.depth, near=1-depth;
    /* each layer fades in past its own precipitation threshold */
    const vis=clamp((p-c.thresh)*2.1,0,1.35)*(isRibbon?1.25:1);
    if(vis<=.02) continue;
    const t=sim.t, tt=t*c.tScale;
    const spanW=gw*c.widthSpan*(.72+.38*kpn);
    const x0=gw*.5 - spanW*.5 + c.xOff*gw*.2;
    const nRays=c.rays;
    const dx=spanW/(nRays-1);
    /* thin, near-vertical rays: narrow base width, varied per ray */
    const rwBase=isRibbon?Math.max(1.0,dx*.95):Math.max(1.0,dx*(1.15+near*.45));
    const drift=t*c.driftSpd*40*(1+kpn*.9);
    const hBase=isRibbon
      ? gh*(.05+.07*p)
      : gh*(.10+.50*p*near+.05*near)*(.75+.55*kpn);
    const bucketBase=clamp(p*1.15+depth*.05,0,1);
    /* not every layer carries red — oxygen 630nm is patchy in reality */
    const bucketMax=Math.round((RAY_BUCKETS-1)*(.55+.45*c.redSeed));
    /* surge --------------------------------------------------- */
    if(sim.surgeQueue>0 && c.surge<-100 && !isRibbon){
      sim.surgeQueue--;
      c.surge=0; c.surgeSpd=.35+Math.random()*.45; c.surgeDir=Math.random()<.5?-1:1;
    }
    const surgePos=c.surge>-100? (c.surgeDir>0? c.surge : 1-c.surge) : -9;

    for(let i=0;i<nRays;i++){
      const u=i/(nRays-1);
      const x=x0+i*dx;
      /* the living base arc: one slow big wave + a medium wave + noise */
      const arc=Math.sin(u*TAU*1.15+tt*.055+c.phase)*gh*.018
               +Math.sin(u*TAU*2.7-tt*.025)*gh*.010;
      const baseY=(horizonY*sc) - gh*(.02+c.yOff*.10+p*.10*near)
                 + pitchPx*sc*(.6+near*.8) + arc;
      const fx=u*6.2*c.foldA+drift*.08+c.phase;
      const fold=c.n1(fx)*.55 + c.n2(fx*2.35+11)*.28 + c.n3(fx*5.1+31)*.13;
      const y=baseY + fold*gh*(.055+.055*near+p*.045);
      const hN=.55+.45*c.n2(u*3.1+tt*.05+c.phase);
      const iN=.45+.55*c.n3(u*4.7-tt*.07+c.phase*.6);
      /* strong per-ray intensity variation: some rays barely there */
      const rayNoise=c.n3(u*7.0+c.phase+tt*.12);
      let inten=vis*iN*(.45+.55*near)*(.45+.55*clamp(rayNoise*.5+.5,0,1));
      if(isRibbon) inten*=1.5;
      inten*=.86+.14*Math.sin(t*(5.5+i*.37)+i*2.1);
      if(surgePos>-1){
        const d=Math.abs(u-surgePos);
        inten*=1+2.6*Math.exp(-d*d*160);
      }
      if(inten<=.012) continue;
      /* per-ray width: thin, medium, a few wide, some hairline */
      const wN=.4+.9*Math.abs(c.n2(u*11+c.phase*1.7));
      const rw=rwBase*wN;
      const hgt=hBase*hN*(.6+.7*iN);
      let bucket=clamp(Math.round((bucketBase*.75+iN*.25*bucketBase*1.4)*(RAY_BUCKETS-1)),0,RAY_BUCKETS-1);
      if(bucket>bucketMax) bucket=bucketMax;
      const hueN=c.n1(u*1.7+c.phase*.6+t*.012)+c.n3(u*.7-t*.008)*.5;
      const hue=hueN<-.28?1:(hueN>.34?2:0);
      g.globalAlpha=clamp(inten*.68,0,.94);
      g.drawImage(raySprites[hue][bucket], x-rw*.5, y-hgt, rw, hgt);
      /* bright ray core: only the strongest rays get a narrow hot centre */
      if((iN>.72||isRibbon) && inten>.14){
        const coreW=Math.max(.8,rw*.22);
        g.globalAlpha=clamp(inten*.38,0,.55);
        g.drawImage(raySprites[hue][bucket], x-coreW*.5, y-hgt*.92, coreW, hgt*.92);
      }
    }
  }
  /* veil / patch: big soft dim pools of light behind everything */
  if(p>.36){
    const nV=isMobile?3:5;
    const vA=clamp((p-.36)*.16,0,.09);
    for(let k=0;k<nV;k++){
      const vx=gw*(.12+.76*(curtains[0].n1(k*3.17+sim.t*.008)*.5+.5));
      const vy=(horizonY*sc)-gh*(.16+.20*(curtains[0].n2(k*2.3-sim.t*.006)*.5+.5))+pitchPx*sc;
      const vs=gw*(.16+.10*(curtains[0].n3(k*1.9)*.5+.5));
      g.globalAlpha=vA*(.6+.4*Math.sin(sim.t*.3+k*2.2));
      g.drawImage(tintSprite(SPR.soft,P.green),vx-vs,vy-vs*.6,vs*2,vs*1.2);
    }
  }
  /* overhead corona at Kp 8-9: rays converging on a seeded zenith point */
  if(S.kp>=8 && perf.coronaScale>0 && !isMobile && !REDUCED){
    const cor=clamp((S.kp-7.5)/1.5,0,1)*clamp(p*1.25,0,1)*perf.coronaScale;
    if(cor>.03){
      const cr1=mulberry32(SEED^0x7c0)(), cr2=mulberry32(SEED^0x7c1)();
      const ccx=gw*(.36+cr1*.28), ccy=gh*(.13+cr2*.08)+pitchPx*sc*1.1;
      const M=Math.round(44*perf.coronaScale);
      for(let i=0;i<M;i++){
        const a=(i/M)*TAU+Math.sin(sim.t*.1)*.05;
        const nz=curtains[0].n2(i*.83+sim.t*.16);
        const len=gh*(.13+.20*(nz*.5+.5));
        const inner=gh*(.035+.015*(curtains[0].n3(i*.61)*.5+.5));
        const rw2=Math.max(1.2,gw*.0035*(.5+Math.abs(nz)));
        const bkt=clamp(Math.round((.55+.35*(nz*.5+.5))*(RAY_BUCKETS-1)),0,RAY_BUCKETS-1);
        g.save();
        g.translate(ccx,ccy); g.rotate(a);
        g.globalAlpha=cor*(.10+.26*clamp(nz*.5+.5,0,1));
        /* bright end outward — near the convergence point the corona is dim */
        g.drawImage(raySprites[0][bkt],-rw2*.5,inner,rw2,len);
        g.restore();
      }
    }
  }
  g.globalAlpha=1;
  g.globalCompositeOperation="source-over";
}
/* surge advance is done in the sim step so it is frame-rate independent */
function stepSurges(dt){
  for(const c of curtains){
    if(c.surge>-100){
      c.surge+=dt*c.surgeSpd;
      if(c.surge>1.25) c.surge=-999;
    }
  }
}

/* --- snow: three depth layers for real parallax ------------------- */
let snow=null,snowN=0;
const SNOW_STRIDE=6;  /* x,y,vx,vy,layer,phase */
function buildSnow(){
  const cap=isMobile?80:150;
  snow=new Float32Array(cap*SNOW_STRIDE);
  snowN=Math.round(cap*perf.snowScale);
  const rnd=mulberry32(SEED^0x5f0);
  for(let i=0;i<cap;i++){
    const o=i*SNOW_STRIDE;
    snow[o]=rnd(); snow[o+1]=rnd();
    snow[o+2]=(rnd()-.5)*.02; snow[o+3]=.012+rnd()*.05;
    /* 0 = far background, 1 = middle, 2 = foreground */
    snow[o+4]=i%5<2?0:(i%5<4?1:2);
    snow[o+5]=rnd()*TAU;
  }
}
function updateSnow(dt){
  if(!snow) return;
  for(let i=0;i<snowN;i++){
    const o=i*SNOW_STRIDE, L=snow[o+4];
    const sp=(.55+L*1.05);
    snow[o]+=(snow[o+2]*sp+Math.sin(sim.t*.7+snow[o+5])*.005*(1+L*.5))*dt;
    snow[o+1]+=snow[o+3]*sp*dt;
    if(snow[o+1]>1.05){ snow[o+1]=-.05; snow[o]=Math.random(); }
    if(snow[o]>1.05) snow[o]=-.05; else if(snow[o]<-.05) snow[o]=1.05;
  }
}
function drawSnow(){
  if(!snow) return;
  const tint=P.snow;
  ctx.fillStyle=`rgb(${(tint[0]*.45+255*.55)|0},${(tint[1]*.45+255*.55)|0},${(tint[2]*.45+255*.55)|0}`+")";
  for(let i=0;i<snowN;i++){
    const o=i*SNOW_STRIDE, L=snow[o+4];
    const x=snow[o]*W, y=snow[o+1]*H;
    const depthFade=smoothstep((snow[o+1]-.06)/.5);
    if(L===0){                    /* far: tiny, slow, dim */
      ctx.globalAlpha=(.05+.07*Math.abs(Math.sin(i)))*depthFade;
      ctx.fillRect(x,y,1.1,1.1);
    }else if(L===1){              /* middle */
      ctx.globalAlpha=(.15+.10*Math.abs(Math.sin(i*1.7)))*depthFade;
      ctx.beginPath(); ctx.arc(x,y,1.3,0,TAU); ctx.fill();
    }else{                        /* foreground: bigger, faster, slightly
                                     elongated like a long-exposure frame */
      ctx.globalAlpha=(.30+.15*Math.abs(Math.sin(i*2.3)))*depthFade;
      const st=1.8+Math.abs(snow[o+3])*38;
      ctx.beginPath(); ctx.ellipse(x,y,1.7,st,0,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

/* --- the moon: it waxes and wanes as simulated time passes ---------- */
const moonPhaseCache=new Map();
function moonSprite(phase){
  /* phase 0 = new, .5 = full, 1 = new again; cached in 40 steps */
  const q=Math.round(phase*40)%40;
  let c=moonPhaseCache.get(q);
  if(c) return c;
  const s=SPR.moon.width;
  c=mkCanvas(s,s);
  const g=c.getContext("2d");
  g.drawImage(SPR.moon,0,0);
  /* carve the shadow with an offset dark disc — waxing from the right */
  const f=q/40;
  const ill=(1-Math.cos(f*TAU))/2;          /* illuminated fraction */
  const dir=f<.5?1:-1;                      /* shadow exits left, returns right */
  const off=(1-ill*2)*dir*s*.98;
  g.globalCompositeOperation="destination-out";
  const sh=g.createRadialGradient(s/2+off,s/2,s*.30,s/2+off,s/2,s*.52);
  sh.addColorStop(0,"rgba(0,0,0,1)");
  sh.addColorStop(.86,"rgba(0,0,0,.96)");
  sh.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=sh;
  g.beginPath(); g.arc(s/2+off,s/2,s*.55,0,TAU); g.fill();
  if(moonPhaseCache.size>44) moonPhaseCache.clear();
  moonPhaseCache.set(q,c);
  return c;
}
function drawMoon(alpha,pitchPx){
  const rnd=mulberry32(SEED^0x3007);
  const mx=W*(.16+rnd()*.66);
  const my=H*(.10+rnd()*.16)+pitchPx*.35+Math.sin(sim.t*.008)*H*.01;
  const r=Math.max(16,Math.min(W,H)*.028);
  /* a full cycle takes ~4 minutes at 1x — visibly growing and shrinking */
  const phase=(.5+sim.t/240)%1;
  const ill=(1-Math.cos(phase*TAU))/2;
  ctx.globalCompositeOperation="lighter";
  const hs=r*11;
  ctx.globalAlpha=alpha*(.06+.17*ill+clamp(sim.precip,0,1)*.05);
  ctx.drawImage(tintSprite(SPR.soft,[190,215,255]),mx-hs/2,my-hs/2,hs,hs);
  const hs2=r*4.2;
  ctx.globalAlpha=alpha*(.10+.24*ill);
  ctx.drawImage(tintSprite(SPR.soft,[225,238,255]),mx-hs2/2,my-hs2/2,hs2,hs2);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=alpha*.96;
  ctx.drawImage(moonSprite(phase),mx-r,my-r,r*2,r*2);
  ctx.globalAlpha=alpha;
  moonX=mx; moonIll=ill; moonOn=true;
}
let moonX=0, moonOn=false, moonIll=1;
/* --- shooting stars ----------------------------------------------- */
let shooter=null, nextShooter=30+Math.random()*70;
function stepShooter(dt){
  if(shooter){
    shooter.t+=dt;
    if(shooter.t>shooter.life){ shooter=null; nextShooter=40+Math.random()*80; }
  }else{
    nextShooter-=dt;
    if(nextShooter<=0 && !REDUCED){
      const a=(-.35-Math.random()*.5);
      shooter={x:.15+Math.random()*.7,y:.05+Math.random()*.35,a,life:.55+Math.random()*.5,t:0,
               len:.10+Math.random()*.14,sp:1.5+Math.random()*1.1};
    }
  }
}
function drawShooter(){
  if(!shooter) return;
  const k=shooter.t/shooter.life;
  const fade=Math.sin(clamp(k,0,1)*Math.PI);
  const px=(shooter.x+Math.cos(shooter.a)*shooter.sp*k*.3)*W;
  const py=(shooter.y-Math.sin(shooter.a)*shooter.sp*k*.3)*H;
  const lx=Math.cos(shooter.a)*shooter.len*W, ly=-Math.sin(shooter.a)*shooter.len*H;
  const g=ctx.createLinearGradient(px,py,px-lx,py-ly);
  g.addColorStop(0,`rgba(255,255,255,${.85*fade})`);
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.strokeStyle=g; ctx.lineWidth=1.6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-lx,py-ly); ctx.stroke();
}

/* --- the whole sky view ------------------------------------------- */
function drawSky(alpha,scaleExtra){
  const pitch=(S.pitch-50)/50;              /* -1 .. +1 */
  const pitchPx=pitch*H*.13;
  ctx.save();
  ctx.globalAlpha=alpha;
  if(scaleExtra!==1){
    ctx.translate(W/2,H*.62); ctx.scale(scaleExtra,scaleExtra); ctx.translate(-W/2,-H*.62);
  }
  /* night sky gradient */
  const g=ctx.createLinearGradient(0,0,0,horizonY+H*.1);
  g.addColorStop(0,rgb(P.sky0,1));
  g.addColorStop(.62,rgb(P.sky1,1));
  g.addColorStop(1,rgb(mixRGB(P.sky1,P.green,.13),1));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  /* stars — parallax moves them less than the curtains */
  if(starCv){
    const sy=-H*.12 + pitchPx*.35;
    /* a bright aurora "over-exposes" the faint stars a little */
    ctx.globalAlpha=alpha*(.95-clamp(sim.precip,0,1)*.28);
    ctx.drawImage(starCv,0,sy,W,H*1.25);
    ctx.globalAlpha=alpha;
  }
  if(S.moon) drawMoon(alpha,pitchPx);
  drawShooter();

  /* curtains onto their own layer, then composited (and mirrored) */
  const sc=CUR_S;
  curCtx.setTransform(1,0,0,1,0,0);
  curCtx.clearRect(0,0,curCv.width,curCv.height);

  curCtx.setTransform(sc,0,0,sc,0,0);
  drawCurtains(curCtx,1,pitchPx);

  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=alpha;
  ctx.drawImage(curCv,0,0,W,H);
  /* bloom: the curtain layer once more, blurred and additive — the hazy
     photographic glow. Skipped when the performance guard has tripped. */
  if(S.bloom>0 && perf.tripped===0 && "filter" in ctx){
    /* blur at ~1/4 resolution, then upscale — same glow, far cheaper */
    bloomCtx.clearRect(0,0,bloomCv.width,bloomCv.height);
    bloomCtx.filter=`blur(${Math.max(2,Math.round((6+S.bloom*.14)*.28))}px)`;
    bloomCtx.drawImage(curCv,0,0,bloomCv.width,bloomCv.height);
    bloomCtx.filter="none";
    ctx.globalAlpha=alpha*(S.bloom/100)*.6;
    ctx.drawImage(bloomCv,0,0,W,H);
  }
  ctx.globalCompositeOperation="source-over";

  /* the frozen lake mirrors the sky */
  if(S.lake){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,lakeTop,W,H-lakeTop);
    ctx.clip();
    const lg=ctx.createLinearGradient(0,lakeTop,0,H);
    lg.addColorStop(0,rgb(mixRGB(P.sky1,[0,0,0],.35),1));
    lg.addColorStop(1,"rgb(2,4,9)");
    ctx.fillStyle=lg; ctx.fillRect(0,lakeTop,W,H-lakeTop);
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=alpha*.55;
    ctx.save();
    /* mirror the curtain layer about the shoreline, strongly foreshortened */
    ctx.translate(0,lakeTop);
    ctx.scale(1,-0.55);
    /* the mirror axis is the horizon, but the image starts at the shoreline */
    ctx.drawImage(curCv,0,-horizonY,W,H);
    ctx.restore();
    ctx.globalCompositeOperation="source-over";
    /* the reflection fades away with distance across the ice */
    const fade=ctx.createLinearGradient(0,lakeTop,0,H);
    fade.addColorStop(0,"rgba(2,4,9,0)");
    fade.addColorStop(.55,"rgba(2,4,9,.55)");
    fade.addColorStop(1,"rgba(2,4,9,.92)");
    ctx.globalAlpha=alpha;
    ctx.fillStyle=fade; ctx.fillRect(0,lakeTop,W,H-lakeTop);
    ctx.globalCompositeOperation="lighter";
    /* moon glint: a soft column of light on the ice */
    if(S.moon){
      const gl=ctx.createLinearGradient(moonX-W*.05,0,moonX+W*.05,0);
      gl.addColorStop(0,"rgba(200,222,255,0)");
      gl.addColorStop(.5,`rgba(210,228,255,${(.03+.09*moonIll).toFixed(3)})`);
      gl.addColorStop(1,"rgba(200,222,255,0)");
      ctx.globalAlpha=alpha;
      ctx.fillStyle=gl; ctx.fillRect(moonX-W*.05,lakeTop,W*.1,H-lakeTop);
    }
    /* a couple of ice cracks catching the light */
    ctx.globalAlpha=alpha*.055;
    ctx.strokeStyle=rgb(P.snow,1); ctx.lineWidth=1;
    const rnd=mulberry32(SEED^0x1ce);
    for(let i=0;i<7;i++){
      const y=lakeTop+(H-lakeTop)*(.15+rnd()*.8);
      const x0=rnd()*W*.8, len=W*(.06+rnd()*.16);
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0+len,y+(rnd()-.5)*8); ctx.stroke();
    }
    ctx.restore();
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=alpha;
  }

  /* faint bright band where sky meets land — separates the planes */
  {
    const hA=.025+clamp(sim.precip,0,1)*.085;
    const hg=ctx.createLinearGradient(0,horizonY-H*.045,0,horizonY+H*.012);
    hg.addColorStop(0,rgb(P.green,0));
    hg.addColorStop(.75,rgb(mixRGB(P.green,[255,255,255],.25),hA));
    hg.addColorStop(1,rgb(P.green,0));
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=alpha;
    ctx.fillStyle=hg; ctx.fillRect(0,horizonY-H*.045,W,H*.06);
    ctx.globalCompositeOperation="source-over";
  }
  /* landscape silhouette, sitting on the shoreline */
  if(landCv) ctx.drawImage(landCv,0,horizonY-2,W,lakeTop-horizonY+2);

  /* snow surfaces breathe with the dominant aurora colour */
  {
    const moonLift=S.moon?.05*moonIll+.008:0;   /* the moon cools and lifts the snow */
    const glow=clamp(sim.precip,0,1)*(.10+.05*Math.sin(sim.t*.5))+moonLift;
    const lit=S.moon?mixRGB(P.green,[200,222,255],.5):P.green;
    const gg=ctx.createLinearGradient(0,horizonY-H*.06,0,H);
    gg.addColorStop(0,rgb(lit,0));
    gg.addColorStop(.18,rgb(lit,glow*.42));
    gg.addColorStop(.55,rgb(lit,glow*.16));
    gg.addColorStop(1,rgb(lit,0));
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=alpha;
    ctx.fillStyle=gg; ctx.fillRect(0,horizonY-H*.06,W,H-horizonY+H*.06);
    ctx.globalCompositeOperation="source-over";
  }
  /* the cabin window */
  if(landCv && landCv._cabin){
    const c=landCv._cabin, y=horizonY-2+c.y;
    ctx.globalCompositeOperation="lighter";
    const flick=.82+.18*Math.sin(sim.t*2.3)+.06*Math.sin(sim.t*7.1);
    ctx.globalAlpha=alpha*flick;
    ctx.fillStyle="rgba(255,186,96,.95)";
    ctx.fillRect(c.x-c.w/2,y,c.w,c.h);
    const gr=c.w*9;
    ctx.globalAlpha=alpha*.30*flick;
    ctx.drawImage(tintSprite(SPR.soft,[255,180,90]),c.x-gr/2,y+c.h/2-gr/2,gr,gr);
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=alpha;
  }

  if(S.snow) drawSnow();

  if(S.labels && labelFade>0.01){
    spaceLabel(T("lblOval"),W*.5,horizonY-H*.13,"center",labelFade*.6);
  }
  ctx.restore();
}

/* ---------------------------------------------------------------
   9. procedural Web Audio — lazy, nothing is loaded
   --------------------------------------------------------------- */
const Audio_={
  on:false, ctx:null, ready:false,
  vol:{master:.70,wind:.60,drone:.45,shim:.65,imp:.70,chime:.50},
  follow:true, lastChime:0
};
const Audio=Audio_;
function noiseBuffer(ac,sec,pink){
  const n=Math.floor(ac.sampleRate*sec);
  const b=ac.createBuffer(1,n,ac.sampleRate);
  const d=b.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<n;i++){
    const w=Math.random()*2-1;
    if(pink){
      b0=.99765*b0+w*.0990460; b1=.96300*b1+w*.0663396; b2=.57000*b2+w*.0757526;
      d[i]=(b0+b1+b2+w*.1848)*.32;
    } else d[i]=w*.6;
  }
  return b;
}
function makeReverb(ac,sec,decay){
  const n=Math.floor(ac.sampleRate*sec);
  const b=ac.createBuffer(2,n,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  const c=ac.createConvolver(); c.buffer=b; return c;
}
function initAudio(){
  if(Audio.ready) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ac=new AC();
  Audio.ctx=ac;
  const master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
  const rev=makeReverb(ac,3.4,2.6);
  const revGain=ac.createGain(); revGain.gain.value=.34;
  rev.connect(revGain); revGain.connect(master);
  Audio.master=master; Audio.rev=rev;

  /* solar wind — pink noise through a wandering bandpass */
  const wsrc=ac.createBufferSource(); wsrc.buffer=noiseBuffer(ac,4,true); wsrc.loop=true;
  const wbp=ac.createBiquadFilter(); wbp.type="bandpass"; wbp.frequency.value=340; wbp.Q.value=.7;
  const wg=ac.createGain(); wg.gain.value=0;
  wsrc.connect(wbp); wbp.connect(wg); wg.connect(master); wg.connect(rev);
  wsrc.start();
  Audio.wind={g:wg,f:wbp};

  /* deep field — soft detuned drone */
  const dg=ac.createGain(); dg.gain.value=0;
  const dlp=ac.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value=320;
  dlp.connect(dg); dg.connect(master); dg.connect(rev);
  [55,55.6,82.5,110.4].forEach((f,i)=>{
    const o=ac.createOscillator(); o.type=i%2?"sine":"triangle"; o.frequency.value=f;
    const g=ac.createGain(); g.gain.value=i<2?.5:.22;
    o.connect(g); g.connect(dlp); o.start();
  });
  Audio.drone={g:dg};

  /* aurora shimmer — airy high noise */
  const ssrc=ac.createBufferSource(); ssrc.buffer=noiseBuffer(ac,4,false); ssrc.loop=true;
  const shp=ac.createBiquadFilter(); shp.type="highpass"; shp.frequency.value=2200;
  const sbp=ac.createBiquadFilter(); sbp.type="bandpass"; sbp.frequency.value=4200; sbp.Q.value=1.2;
  const sg=ac.createGain(); sg.gain.value=0;
  ssrc.connect(shp); shp.connect(sbp); sbp.connect(sg); sg.connect(master); sg.connect(rev);
  ssrc.start();
  Audio.shim={g:sg,f:sbp};

  Audio.ready=true;
}
function audioEnable(on){
  Audio.on=on;
  if(on){
    initAudio();
    if(Audio.ctx && Audio.ctx.state==="suspended") Audio.ctx.resume();
  }
  if(Audio.ready){
    const t=Audio.ctx.currentTime;
    Audio.master.gain.cancelScheduledValues(t);
    Audio.master.gain.setTargetAtTime(on?Audio.vol.master:0,t,.5);
  }
}
function audioFrame(dt){
  if(!Audio.ready||!Audio.on) return;
  const t=Audio.ctx.currentTime;
  const follow=Audio.follow?1:.35;
  const flux=clamp(sim.windFlux,0,1.2), pr=clamp(sim.precip,0,1.2);
  Audio.wind.g.gain.setTargetAtTime(Audio.vol.wind*.075*(.35+flux*follow),t,.6);
  Audio.wind.f.frequency.setTargetAtTime(240+Math.sin(sim.t*.11)*120+flux*follow*520,t,.9);
  Audio.drone.g.gain.setTargetAtTime(Audio.vol.drone*.075,t,1.2);
  Audio.shim.g.gain.setTargetAtTime(Audio.vol.shim*.035*(.12+pr*follow*1.1),t,.5);
  Audio.shim.f.frequency.setTargetAtTime(2800+pr*follow*3800+Math.sin(sim.t*.27)*500,t,.7);
  Audio.master.gain.setTargetAtTime(Audio.vol.master,t,.4);
}
Audio.impact=function(st){
  if(!Audio.ready||!Audio.on) return;
  const ac=Audio.ctx,t=ac.currentTime;
  const o=ac.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(110*(.8+st*.5),t);
  o.frequency.exponentialRampToValueAtTime(26,t+1.6);
  const g=ac.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(Audio.vol.imp*.55*(.5+st*.6),t+.05);
  g.gain.exponentialRampToValueAtTime(.0006,t+2.6);
  o.connect(g); g.connect(Audio.master); g.connect(Audio.rev);
  o.start(t); o.stop(t+2.8);
};
Audio.eruption=function(st){
  if(!Audio.ready||!Audio.on) return;
  const ac=Audio.ctx,t=ac.currentTime;
  const src=ac.createBufferSource(); src.buffer=noiseBuffer(ac,1.4,true);
  const f=ac.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.1;
  f.frequency.setValueAtTime(180,t); f.frequency.exponentialRampToValueAtTime(1400,t+1.1);
  const g=ac.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(Audio.vol.imp*.22*(.4+st*.6),t+.25);
  g.gain.exponentialRampToValueAtTime(.0005,t+1.5);
  src.connect(f); f.connect(g); g.connect(Audio.master); g.connect(Audio.rev);
  src.start(t); src.stop(t+1.5);
};
const PENTA=[0,3,5,7,10,12,15,19];
Audio.chime=function(intensity){
  if(!Audio.ready||!Audio.on) return;
  const ac=Audio.ctx,t=ac.currentTime;
  const dens=Audio.follow?(.06+intensity*.5):.16;
  if(Math.random()>dens*.16) return;
  if(t-Audio.lastChime<.16) return;
  Audio.lastChime=t;
  const n=PENTA[(Math.random()*PENTA.length)|0];
  const freq=392*Math.pow(2,n/12)*(Math.random()<.4?2:1);
  const o=ac.createOscillator(); o.type="sine"; o.frequency.value=freq;
  const o2=ac.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2.01;
  const g=ac.createGain(), g2=ac.createGain();
  const v=Audio.vol.chime*.10*(.4+Math.random()*.6);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01);
  g.gain.exponentialRampToValueAtTime(.0004,t+2.2);
  g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(v*.3,t+.01);
  g2.gain.exponentialRampToValueAtTime(.0004,t+1.1);
  o.connect(g); o2.connect(g2);
  g.connect(Audio.master); g.connect(Audio.rev); g2.connect(Audio.rev);
  o.start(t); o.stop(t+2.3); o2.start(t); o2.stop(t+1.2);
};

/* ---------------------------------------------------------------
   10. UI plumbing
   --------------------------------------------------------------- */
const $=id=>document.getElementById(id);
let labelFade=S.labels?1:0;
let toastTimer=null, capTimer=null;
function toast(msg){
  const el=$("toast");
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("on"),2600);
}
function showCaption(html,ms){
  const el=$("caption");
  el.innerHTML=html; el.classList.add("on");
  clearTimeout(capTimer);
  capTimer=setTimeout(()=>el.classList.remove("on"),ms||7000);
}

/* --- view transition ---------------------------------------------- */
let viewMix=(S.view==="sky")?1:0;      /* 0 space, 1 sky */
let viewTarget=viewMix, viewAnim=null;
function setView(v,quiet){
  if(S.view===v) return;
  S.view=v; viewTarget=(v==="sky")?1:0;
  viewAnim={from:viewMix,to:viewTarget,t:0,dur:1.5};
  syncViewUI();
  if(!quiet) toast(v==="sky"?T("tSky"):T("tSpace"));
  pushURL();
}
function syncViewUI(){
  $("btnSky").classList.toggle("on",S.view==="sky");
  $("btnSpace").classList.toggle("on",S.view==="space");
  document.querySelectorAll(".sky-only").forEach(e=>e.classList.toggle("off",S.view!=="sky"));
  document.querySelectorAll(".space-only").forEach(e=>e.classList.toggle("off",S.view!=="space"));
}

/* --- URL state ---------------------------------------------------- */
function pushURL(){
  const q=new URLSearchParams();
  q.set("seed",S.seed); q.set("view",S.view); q.set("kp",S.kp);
  q.set("speed",S.speed); q.set("pitch",Math.round(S.pitch)); q.set("zoom",S.zoom.toFixed(2));
  q.set("pal",S.pal); q.set("boost",S.boost); q.set("bloom",Math.round(S.bloom)); q.set("stars",S.stars);
  q.set("lang",S.lang);
  const b={drift:S.drift,auto:S.auto,field:S.field,flow:S.flow,snow:S.snow,lake:S.lake,moon:S.moon,
           labels:S.labels,autopal:S.autoPal,perf:S.perf};
  for(const k in b) q.set(k,b[k]?"1":"0");
  history.replaceState(null,"","?"+q.toString());
}

/* --- language ------------------------------------------------------ */
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>{
    const k=e.getAttribute("data-i18n");
    const v=T(k);
    if(v!==undefined) e.textContent=v;
  });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
  $("creditLink").textContent=T("credit");
  $("hint").innerHTML=T("hint");
  $("kpDesc").textContent=T("kpDesc")[S.kp];
  buildPalButtons();
  numFmt=new Intl.NumberFormat(LOCALE[S.lang],{maximumFractionDigits:1});
  refreshReadouts();
  localStorage.setItem("aurora.lang",S.lang);
}
function buildPalButtons(){
  const grid=$("palGrid");
  grid.innerHTML="";
  PALETTES.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="pal"+(i===S.pal?" on":"");
    b.innerHTML=`${T("palNames")[i]}<span class="sws">
      <i style="background:${rgb(p.green,1)}"></i>
      <i style="background:${rgb(p.red,1)}"></i>
      <i style="background:${rgb(p.purple,1)}"></i>
      <i style="background:${rgb(p.snow,1)}"></i></span>`;
    b.onclick=()=>setPalette(i);
    grid.appendChild(b);
  });
}
function setPalette(i){
  if(i===S.pal && palMix>=1) return;
  palA=PALETTES[S.pal]; palB=PALETTES[i]; palMix=0;
  S.pal=i;
  document.querySelectorAll(".pal").forEach((b,j)=>b.classList.toggle("on",j===i));
  pushURL();
}
function refreshReadouts(){
  $("kpVal").textContent=fmt(S.kp);
  $("kpEff").textContent=fmt(sim.effKp,1);
  $("kpDesc").textContent=T("kpDesc")[S.kp];
  $("speedVal").textContent=fmt(S.speed,1)+"×";
  $("pitchVal").textContent=fmt(Math.round(S.pitch*.8))+"\u00b0";
  $("zoomVal").textContent=fmt(S.zoom,2)+"×";
  $("boostVal").textContent=fmt(S.boost)+"%";
  $("bloomVal").textContent=fmt(Math.round(S.bloom))+"%";
  $("starsVal").textContent=fmt(S.stars)+"%";
  $("vMasterVal").textContent=fmt(Math.round(Audio.vol.master*100))+"%";
  $("vWindVal").textContent=fmt(Math.round(Audio.vol.wind*100))+"%";
  $("vDroneVal").textContent=fmt(Math.round(Audio.vol.drone*100))+"%";
  $("vShimVal").textContent=fmt(Math.round(Audio.vol.shim*100))+"%";
  $("vImpVal").textContent=fmt(Math.round(Audio.vol.imp*100))+"%";
  $("vChimeVal").textContent=fmt(Math.round(Audio.vol.chime*100))+"%";
}

/* --- performance guard -------------------------------------------- */
const perf={rayScale:1,snowScale:1,windScale:1,ribbonScale:1,coronaScale:1,reflectionScale:1,windows:0,acc:0,frames:0,tripped:0};
function perfCheck(dt){
  if(!S.perf||perf.tripped>=3) return;
  perf.acc+=dt; perf.frames++;
  if(perf.acc>=1){
    const fps=perf.frames/perf.acc;
    perf.acc=0; perf.frames=0;
    if(fps<35) perf.windows++; else perf.windows=0;
    if(perf.windows>=3){
      perf.windows=0; perf.tripped++;
      /* staged: always drop the least visible thing first */
      if(perf.tripped===1){
        perf.coronaScale=0;
        perf.ribbonScale=.5;
        retuneCurtains();
      }else if(perf.tripped===2){
        perf.rayScale*=.7; perf.snowScale*=.65; perf.windScale*=.65;
        retuneCurtains();
        snowN=Math.max(24,Math.round(snowN*.65));
        windN=Math.max(90,Math.round(windCap*perf.windScale));
        DPR_CAP=1.5; resize();
      }else{
        perf.reflectionScale=.5;
        CUR_S=Math.max(.42,CUR_S*.8); sizeOffscreens();
      }
      toast(T("tPerf"));
    }
  }
}

/* --- projector mode ------------------------------------------------ */
const proj={on:false,t:0,stage:0,savedView:null,savedPitch:0};
function toggleProjector(force){
  if(REDUCED) return;
  const on=force!==undefined?force:!proj.on;
  proj.on=on;
  if(on){
    proj.t=0; proj.stage=0; proj.savedView=S.view; proj.savedPitch=S.pitch;
    document.body.classList.add("uihidden");
    toast(T("tProjOn"));
  }else{
    document.body.classList.remove("uihidden");
    S.pitch=proj.savedPitch; $("pitch").value=S.pitch;
    toast(T("tProjOff"));
  }
}
function projectorStep(dt){
  if(!proj.on) return;
  proj.t+=dt;
  /* slow pitch drift while we are in the sky */
  if(S.view==="sky"){
    S.pitch=clamp(50+Math.sin(proj.t*.045)*38,0,100);
    $("pitch").value=S.pitch;
  }
  /* jump to space just before an auto CME, follow it home, come back */
  if(S.view==="sky" && S.auto && sim.phase===PHASE.QUIET && sim.nextAuto<3.5){
    setView("space",true);
  }
  if(S.view==="space"){
    S.zoom=clamp(lerp(S.zoom, sim.cme? 1.25:1.0, dt*.6),.6,2.5);
    $("zoom").value=S.zoom;
    if(sim.phase===PHASE.STORM && sim.phaseT>3.2) setView("sky",true);
    if(sim.phase===PHASE.QUIET && sim.nextAuto>8) setView("sky",true);
  }
}

/* ---------------------------------------------------------------
   11. main loop
   --------------------------------------------------------------- */
let last=performance.now(), started=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>.1) dt=.1;
  const sdt=dt*(REDUCED?0:S.speed);

  /* palette crossfade */
  if(palMix<1){
    palMix=clamp(palMix+dt/palFadeDur,0,1);
    updatePalette();
    buildRaySprites(false);
    if(palMix>=1){ palA=palB; }
  }
  if(S.autoPal && palMix>=1){
    autoPalT-=dt;
    if(autoPalT<=0){ autoPalT=26+Math.random()*20; setPalette((S.pal+1)%PALETTES.length); }
  }
  /* label fade */
  const lt=S.labels?1:0;
  labelFade=lerp(labelFade,lt,1-Math.pow(.004,dt));

  /* view transition */
  if(viewAnim){
    viewAnim.t+=dt;
    const k=clamp(viewAnim.t/viewAnim.dur,0,1);
    viewMix=lerp(viewAnim.from,viewAnim.to,easeInOut(k));
    if(k>=1) viewAnim=null;
  }

  stepSim(sdt);
  stepSurges(sdt);
  updateWind(sdt);
  updateSnow(sdt);
  stepShooter(sdt);
  projectorStep(dt);
  audioFrame(dt);

  /* camera drift in space view */
  if(S.drift && !REDUCED){
    space.driftT+=sdt;
    space.camX=Math.sin(space.driftT*.07)*W*.02;
    space.camY=Math.cos(space.driftT*.052)*H*.018;
  }else{ space.camX=lerp(space.camX,0,dt); space.camY=lerp(space.camY,0,dt); }

  /* ---- render ---- */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  const m=viewMix;
  if(m<.999) drawSpace(1-m, lerp(1,1.45,m));
  if(m>.001) drawSky(m, lerp(1.14,1,m));

  refreshTick+=dt;
  if(refreshTick>.25){ refreshTick=0; $("kpEff").textContent=fmt(sim.effKp,1); }

  perfCheck(dt);
  requestAnimationFrame(frame);
}
let refreshTick=0, autoPalT=26;

/* ---------------------------------------------------------------
   12. wiring
   --------------------------------------------------------------- */
function bindRange(id,key,fn){
  const el=$(id);
  el.addEventListener("input",()=>{
    S[key]=parseFloat(el.value);
    if(fn) fn();
    refreshReadouts();
    pushURL();
  });
}
function bindSwitch(id,key,fn){
  const el=$(id);
  el.checked=S[key];
  el.addEventListener("change",()=>{ S[key]=el.checked; if(fn) fn(); pushURL(); });
}
function initUI(){
  /* restore control values from state */
  $("kp").value=S.kp; $("speed").value=S.speed; $("pitch").value=S.pitch;
  $("zoom").value=S.zoom; $("boost").value=S.boost; $("bloom").value=S.bloom; $("stars").value=S.stars;
  $("autoStorm").checked=S.auto; $("perfGuard").checked=S.perf;
  $("autoPal").checked=S.autoPal;

  bindRange("kp","kp",()=>{ $("kpDesc").textContent=T("kpDesc")[S.kp]; });
  bindRange("speed","speed");
  bindRange("pitch","pitch");
  bindRange("zoom","zoom");
  bindRange("boost","boost",()=>buildRaySprites(true));
  bindRange("bloom","bloom");
  bindRange("stars","stars",()=>buildStarLayer());
  bindSwitch("autoStorm","auto");
  bindSwitch("drift","drift");
  bindSwitch("tField","field");
  bindSwitch("tFlow","flow");
  bindSwitch("tSnow","snow");
  bindSwitch("tLake","lake");
  bindSwitch("tMoon","moon");
  bindSwitch("tLabels","labels");
  bindSwitch("autoPal","autoPal");
  bindSwitch("perfGuard","perf");

  $("btnSky").onclick=()=>setView("sky");
  $("btnSpace").onclick=()=>setView("space");
  $("btnCME").onclick=()=>launchCME();

  /* sound */
  $("sndOn").addEventListener("change",e=>{ audioEnable(e.target.checked); toast(e.target.checked?T("tSoundOn"):T("tSoundOff")); });
  $("sndFollow").addEventListener("change",e=>{ Audio.follow=e.target.checked; });
  const vmap=[["vMaster","master"],["vWind","wind"],["vDrone","drone"],
              ["vShim","shim"],["vImp","imp"],["vChime","chime"]];
  for(const [id,k] of vmap){
    $(id).value=Audio.vol[k]*100;
    $(id).addEventListener("input",e=>{ Audio.vol[k]=parseFloat(e.target.value)/100; refreshReadouts(); });
  }

  /* actions */
  $("btnPhoto").onclick=takePhoto;
  $("btnLink").onclick=()=>{
    pushURL();
    const url=location.href;
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>toast(T("tLinked")))
      .catch(()=>{ prompt("URL",url); });
  };
  $("btnProj").onclick=()=>toggleProjector();
  $("btnHide").onclick=()=>document.body.classList.toggle("uihidden");

  /* panel minimise / restore */
  $("btnMin").onclick=()=>{ $("panel").classList.add("hidden"); $("restore").classList.remove("hidden"); };
  $("restore").onclick=()=>{ $("panel").classList.remove("hidden"); $("restore").classList.add("hidden"); };

  /* tabs */
  document.querySelectorAll(".tabs button").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll(".tabs button").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-selected","false");});
      b.classList.add("on"); b.setAttribute("aria-selected","true");
      document.querySelectorAll(".tab-body").forEach(x=>x.classList.toggle("on",x.dataset.body===b.dataset.tab));
    };
  });
  /* language */
  document.querySelectorAll(".lang button").forEach(b=>{
    b.onclick=()=>{ S.lang=b.dataset.lang; applyLang(); pushURL(); };
  });

    syncViewUI();
  applyLang();
  /* on a phone the drawer starts closed so the sky is the first thing you see */
  if(Math.min(window.innerWidth,window.innerHeight)<700){
    $("panel").classList.add("hidden");
    $("restore").classList.remove("hidden");
  }
}

/* --- photo export --------------------------------------------------- */
function takePhoto(){
  document.body.classList.add("shooting");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    try{
      const url=cv.toDataURL("image/png");
      const a=document.createElement("a");
      a.href=url;
      a.download=`aurora-${S.seed}-${S.view}-kp${S.kp}.png`;
      a.click();
      toast(T("tPhoto"));
    }catch(e){ /* ignore */ }
    document.body.classList.remove("shooting");
  }));
}

/* --- input ---------------------------------------------------------- */
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase();
  if(k==="v"){ setView(S.view==="sky"?"space":"sky"); }
  else if(k==="c"){ launchCME(); }
  else if(k==="h"){ document.body.classList.toggle("uihidden"); }
  else if(k==="f"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if(k==="p"){ takePhoto(); }
  else if(k==="m"){ const c=$("sndOn"); c.checked=!c.checked; audioEnable(c.checked); toast(c.checked?T("tSoundOn"):T("tSoundOff")); }
  else if(e.code==="Space"){ e.preventDefault(); toggleProjector(); }
  else if(k==="escape"){ if(proj.on) toggleProjector(false); }
});
cv.addEventListener("wheel",e=>{
  if(S.view!=="space") return;
  e.preventDefault();
  S.zoom=clamp(S.zoom*(e.deltaY>0?.94:1.064),.6,2.5);
  $("zoom").value=S.zoom; refreshReadouts(); pushURL();
},{passive:false});
cv.addEventListener("click",()=>{ if(proj.on) toggleProjector(false); });
/* pinch zoom in space view */
let pinch=0;
cv.addEventListener("touchmove",e=>{
  if(e.touches.length!==2||S.view!=="space") return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch){ S.zoom=clamp(S.zoom*(d/pinch),.6,2.5); $("zoom").value=S.zoom; refreshReadouts(); }
  pinch=d;
},{passive:true});
cv.addEventListener("touchend",()=>{pinch=0;});
window.addEventListener("resize",()=>{ resize(); });

/* ---------------------------------------------------------------
   13. go
   --------------------------------------------------------------- */
watchDPR();
initUI();
resize();
buildWind();
buildSnow();
pushURL();

if(REDUCED){
  sim.precip=.45; sim.precipTarget=.45; sim.effKp=4.2;
  setTimeout(()=>toast(T("tReduced")),1200);
}
requestAnimationFrame(frame);

/* fade in from black over 2 s */
requestAnimationFrame(()=>{ $("fade").classList.add("gone"); });
setTimeout(()=>{ $("fade").style.display="none"; },2300);

/* keyboard hint, desktop only */
if(!isMobile && !("ontouchstart" in window)){
  setTimeout(()=>$("hint").classList.add("on"),1400);
  setTimeout(()=>$("hint").classList.remove("on"),10400);
}
</script>
