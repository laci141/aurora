<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora — Solar Storm to Northern Lights</title>
<meta name="description" content="Interactive aurora borealis simulator: solar storms, magnetosphere physics and dancing curtains of light over a winter landscape. One file, canvas 2D.">
<style>
:root{
  --accent:#3aff8c;
  --accent-soft:rgba(58,255,140,.20);
  --ink:#e8eef7;
  --ink-dim:#9fb0c6;
  --panel-w:308px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#03060d;color:var(--ink);overflow:hidden;
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
canvas{display:block}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* ---------- fade in ---------- */
#fade{position:fixed;inset:0;background:#000;z-index:90;pointer-events:none;transition:opacity 2s ease}
#fade.gone{opacity:0}

/* ---------- glass panel ---------- */
.glass-panel{
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:0 18px 50px -18px rgba(0,0,0,.75);
  color:var(--ink);
}
#panel{
  position:fixed;top:16px;right:16px;width:var(--panel-w);z-index:40;
  padding:14px 14px 12px;
  max-height:calc(100vh - 32px);display:flex;flex-direction:column;
  transform-origin:100% 0;
  transition:transform .5s cubic-bezier(.22,.9,.3,1),opacity .45s ease;
}
#panel.hidden{transform:scale(.9) translateY(-12px);opacity:0;pointer-events:none}
.p-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.p-title{font-weight:650;letter-spacing:.09em;font-size:12px;text-transform:uppercase;color:var(--ink-dim);flex:1}
.p-title b{color:var(--accent);font-weight:700;letter-spacing:.14em}
.icon-btn{
  width:26px;height:26px;flex:0 0 auto;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:var(--ink);font-size:13px;line-height:1;display:grid;place-items:center;
  transition:background .2s ease,transform .2s ease}
.icon-btn:hover{background:rgba(255,255,255,.15)}
.icon-btn:active{transform:scale(.92)}

#restore{
  position:fixed;top:16px;right:16px;z-index:41;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;font-size:17px;cursor:pointer;color:var(--ink);
  background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  box-shadow:0 12px 30px -12px rgba(0,0,0,.8);
  transition:opacity .4s ease,transform .4s cubic-bezier(.22,.9,.3,1);
}
#restore.hidden{opacity:0;transform:scale(.6);pointer-events:none}

/* ---------- language ---------- */
.lang{display:flex;gap:4px;margin-bottom:10px}
.lang button{
  flex:1;padding:5px 0;font-size:11px;letter-spacing:.06em;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:8px;color:var(--ink-dim);transition:.2s}
.lang button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:11px}
.tabs button{
  flex:1;padding:7px 0;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;color:var(--ink-dim);transition:.2s}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tab-body{display:none;overflow-y:auto;overscroll-behavior:contain;padding-right:3px;flex:1;min-height:0}
.tab-body.on{display:block}
.tab-body::-webkit-scrollbar{width:5px}
.tab-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}

/* ---------- rows ---------- */
.row{margin:0 0 11px}
.row.off{display:none}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:11px;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:5px}
.lbl .v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;font-size:11px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;
  background:var(--accent);border:0;box-shadow:0 0 10px var(--accent-soft)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--accent)}

.seg{display:flex;gap:4px}
.seg button{
  flex:1;padding:8px 0;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--ink-dim);
  transition:.25s}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.btn{
  width:100%;padding:9px 10px;border-radius:11px;cursor:pointer;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:var(--ink);
  transition:background .2s,transform .15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn:active{transform:scale(.975)}
.btn.hero{background:linear-gradient(150deg,var(--accent-soft),rgba(255,255,255,.05));border-color:var(--accent)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.sw-row{display:flex;align-items:center;gap:9px;margin:0 0 9px;cursor:pointer;user-select:none}
.sw-row.off{display:none}
.sw-row span.t{flex:1;font-size:12px;color:var(--ink-dim)}
.sw{position:relative;width:34px;height:19px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{
  position:absolute;inset:0;border-radius:19px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);transition:.25s}
.sw i::after{
  content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--ink-dim);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked + i{background:var(--accent-soft);border-color:var(--accent)}
.sw input:checked + i::after{transform:translateX(15px);background:var(--accent)}

.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal{
  padding:7px 8px;border-radius:11px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:var(--ink-dim);font-size:11px;font-weight:600;transition:.25s;line-height:1.2}
.pal.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.pal .sws{display:flex;gap:3px;margin-top:5px}
.pal .sws i{width:12px;height:5px;border-radius:3px;display:block}
.sec{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.35);
  margin:14px 0 8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.note{font-size:10.5px;line-height:1.4;color:rgba(255,255,255,.38);margin:-3px 0 10px}

/* ---------- overlays ---------- */
#credit{
  position:fixed;left:16px;bottom:14px;z-index:35;font-size:11.5px;color:rgba(255,255,255,.42);
  transition:opacity .5s ease;text-shadow:0 1px 6px rgba(0,0,0,.9)}
#credit a{color:rgba(255,255,255,.62);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.16)}
#credit a:hover{color:var(--accent);border-color:var(--accent)}

#hint{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:36;
  font-size:11.5px;letter-spacing:.03em;color:rgba(255,255,255,.55);white-space:nowrap;
  padding:7px 14px;border-radius:99px;background:rgba(10,16,28,.45);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .8s ease;pointer-events:none}
#hint.on{opacity:1}
#hint b{color:var(--accent);font-weight:700}

#caption{
  position:fixed;left:50%;top:11%;transform:translate(-50%,-8px);z-index:37;
  max-width:min(560px,86vw);text-align:center;padding:16px 20px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  box-shadow:0 18px 50px -18px rgba(0,0,0,.75);
  font-size:13.5px;line-height:1.55;color:#eef4ff;
  opacity:0;pointer-events:none;transition:opacity .9s ease,transform .9s cubic-bezier(.22,.9,.3,1)}
#caption.on{opacity:1;transform:translate(-50%,0)}
#caption .k{color:var(--accent);font-weight:650}

#toast{
  position:fixed;left:50%;top:14px;transform:translate(-50%,-14px);z-index:60;
  padding:7px 14px;border-radius:99px;font-size:11px;font-weight:550;opacity:0;
  background:rgba(10,16,28,.6);border:1px solid rgba(255,255,255,.12);color:var(--ink);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s cubic-bezier(.22,.9,.3,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}

body.uihidden #panel,body.uihidden #restore,body.uihidden #credit,body.uihidden #hint,body.uihidden #caption{
  opacity:0;pointer-events:none}
body.shooting #panel,body.shooting #restore,body.shooting #credit,body.shooting #hint,body.shooting #caption,body.shooting #toast{
  opacity:0!important}

/* ---------- mobile: bottom drawer ---------- */
@media (max-width:700px){
  #panel{
    top:auto;bottom:0;left:0;right:0;width:auto;max-height:min(56vh,430px);
    border-radius:20px 20px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
    box-shadow:0 -12px 34px -14px rgba(0,0,0,.8);
    transform-origin:50% 100%}
  #panel.hidden{transform:translateY(103%);opacity:1}
  #panel::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
  .p-head{margin-top:6px}
  #restore{
    top:auto;bottom:0;right:50%;transform:translateX(50%);width:104px;height:34px;
    border-radius:14px 14px 0 0;font-size:13px;letter-spacing:.05em;
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
  #restore.hidden{transform:translateX(50%) translateY(105%);opacity:0}
  #credit{font-size:10.5px;bottom:44px}
  #hint{display:none}
  #caption{top:8%;font-size:12.5px;padding:13px 16px}
  .tab-body{max-height:30vh}
}
@media (prefers-reduced-motion:reduce){
  #panel,#restore,#caption,#toast,#fade{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fade"></div>

<div id="caption"></div>
<div id="toast"></div>
<div id="hint"></div>
<footer id="credit"><a id="creditLink" href="https://github.com/laci141/aurora" target="_blank" rel="noopener"></a></footer>

<button id="restore" class="hidden" aria-label="Show controls">☰</button>

<aside id="panel" class="glass-panel" aria-label="Aurora control panel">
  <div class="p-head">
    <div class="p-title"><b>AURORA</b> <span data-i18n="subtitle"></span></div>
    <button class="icon-btn" id="btnMin" aria-label="Minimise">—</button>
  </div>

  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button>
    <button data-lang="hu">HU</button>
    <button data-lang="ro">RO</button>
    <button data-lang="de">DE</button>
  </div>

  <div class="tabs" role="tablist" aria-label="Aurora controls">
    <button role="tab" aria-selected="true" data-tab="0" class="on" data-i18n="tabStorm"></button>
    <button role="tab" aria-selected="false" data-tab="1" data-i18n="tabVisuals"></button>
    <button role="tab" aria-selected="false" data-tab="2" data-i18n="tabSound"></button>
  </div>

  <!-- ============ TAB 1: STORM ============ -->
  <div class="tab-body on" data-body="0">
    <div class="row">
      <div class="lbl"><span data-i18n="view"></span></div>
      <div class="seg">
        <button id="btnSpace" data-i18n="viewSpace"></button>
        <button id="btnSky" class="on" data-i18n="viewSky"></button>
      </div>
    </div>

    <div class="row">
      <div class="lbl"><span data-i18n="kp"></span><span class="v"><span id="kpVal">3</span> · <span id="kpEff">3.0</span></span></div>
      <input type="range" id="kp" min="0" max="9" step="1" value="3">
      <div class="note" id="kpDesc"></div>
    </div>

    <div class="row"><button class="btn hero" id="btnCME" data-i18n="launchCME"></button></div>

    <label class="sw-row"><span class="t" data-i18n="autoStorm"></span>
      <span class="sw"><input type="checkbox" id="autoStorm" checked><i></i></span></label>

    <div class="row">
      <div class="lbl"><span data-i18n="speed"></span><span class="v" id="speedVal">1.0×</span></div>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
    </div>

    <div class="row sky-only" id="rowPitch">
      <div class="lbl"><span data-i18n="pitch"></span><span class="v" id="pitchVal">40\u00b0</span></div>
      <input type="range" id="pitch" min="0" max="100" step="1" value="50">
    </div>

    <div class="row space-only off" id="rowZoom">
      <div class="lbl"><span data-i18n="zoom"></span><span class="v" id="zoomVal">1.00×</span></div>
      <input type="range" id="zoom" min="0.6" max="2.5" step="0.02" value="1">
    </div>
    <label class="sw-row space-only off" id="rowDrift"><span class="t" data-i18n="camDrift"></span>
      <span class="sw"><input type="checkbox" id="drift" checked><i></i></span></label>

    <div class="sec" data-i18n="secLayers"></div>
    <label class="sw-row space-only off"><span class="t" data-i18n="fieldLines"></span>
      <span class="sw"><input type="checkbox" id="tField" checked><i></i></span></label>
    <label class="sw-row space-only off"><span class="t" data-i18n="particleFlow"></span>
      <span class="sw"><input type="checkbox" id="tFlow" checked><i></i></span></label>
    <label class="sw-row sky-only"><span class="t" data-i18n="snowfall"></span>
      <span class="sw"><input type="checkbox" id="tSnow" checked><i></i></span></label>
    <label class="sw-row sky-only"><span class="t" data-i18n="lake"></span>
      <span class="sw"><input type="checkbox" id="tLake" checked><i></i></span></label>
    <label class="sw-row sky-only"><span class="t" data-i18n="moon"></span>
      <span class="sw"><input type="checkbox" id="tMoon"><i></i></span></label>
    <label class="sw-row"><span class="t" data-i18n="labels"></span>
      <span class="sw"><input type="checkbox" id="tLabels"><i></i></span></label>
  </div>

  <!-- ============ TAB 2: VISUALS ============ -->
  <div class="tab-body" data-body="1">
    <div class="sec" data-i18n="secPalette"></div>
    <div class="pal-grid" id="palGrid"></div>
    <label class="sw-row" style="margin-top:10px"><span class="t" data-i18n="autoPalette"></span>
      <span class="sw"><input type="checkbox" id="autoPal"><i></i></span></label>

    <div class="row">
      <div class="lbl"><span data-i18n="boost"></span><span class="v" id="boostVal">15%</span></div>
      <input type="range" id="boost" min="0" max="25" step="1" value="15">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="bloom"></span><span class="v" id="bloomVal">45%</span></div>
      <input type="range" id="bloom" min="0" max="100" step="1" value="45">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="starDensity"></span><span class="v" id="starsVal">100%</span></div>
      <input type="range" id="stars" min="20" max="180" step="5" value="100">
    </div>
    <label class="sw-row"><span class="t" data-i18n="perfGuard"></span>
      <span class="sw"><input type="checkbox" id="perfGuard" checked><i></i></span></label>
    <div class="note" data-i18n="perfNote"></div>

    <div class="sec" data-i18n="secActions"></div>
    <div class="btn-grid">
      <button class="btn" id="btnPhoto" data-i18n="photo"></button>
      <button class="btn" id="btnLink" data-i18n="copyLink"></button>
      <button class="btn" id="btnProj" data-i18n="projector"></button>
      <button class="btn" id="btnHide" data-i18n="hideUI"></button>
    </div>
    <div class="note" style="margin-top:9px" data-i18n="seedNote"></div>
  </div>

  <!-- ============ TAB 3: SOUND ============ -->
  <div class="tab-body" data-body="2">
    <label class="sw-row"><span class="t" data-i18n="soundOn"></span>
      <span class="sw"><input type="checkbox" id="sndOn"><i></i></span></label>
    <div class="note" data-i18n="soundNote"></div>
    <div class="row">
      <div class="lbl"><span data-i18n="volMaster"></span><span class="v" id="vMasterVal">70%</span></div>
      <input type="range" id="vMaster" min="0" max="100" step="1" value="70">
    </div>
    <div class="sec" data-i18n="secLayersSnd"></div>
    <div class="row">
      <div class="lbl"><span data-i18n="sndWind"></span><span class="v" id="vWindVal">60%</span></div>
      <input type="range" id="vWind" min="0" max="100" step="1" value="60">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="sndDrone"></span><span class="v" id="vDroneVal">45%</span></div>
      <input type="range" id="vDrone" min="0" max="100" step="1" value="45">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="sndShimmer"></span><span class="v" id="vShimVal">65%</span></div>
      <input type="range" id="vShim" min="0" max="100" step="1" value="65">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="sndImpact"></span><span class="v" id="vImpVal">70%</span></div>
      <input type="range" id="vImp" min="0" max="100" step="1" value="70">
    </div>
    <div class="row">
      <div class="lbl"><span data-i18n="sndChimes"></span><span class="v" id="vChimeVal">50%</span></div>
      <input type="range" id="vChime" min="0" max="100" step="1" value="50">
    </div>
    <label class="sw-row"><span class="t" data-i18n="sndFollow"></span>
      <span class="sw"><input type="checkbox" id="sndFollow" checked><i></i></span></label>
  </div>
</aside>
<script>
"use strict";
/* =====================================================================
   AURORA — from a solar eruption to curtains of light over the snow.
   Third in the series after "Density Wave" and "Orrery".
   One file, canvas 2D, no libraries.
   ===================================================================== */

/* ---------------------------------------------------------------
   0. seeded randomness — mulberry32, seed lives in the URL
   --------------------------------------------------------------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hashStr(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const smoothstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;

/* ---------------------------------------------------------------
   1. state, restored from the query string
   --------------------------------------------------------------- */
const Q=new URLSearchParams(location.search);
const REDUCED=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function qNum(k,def,min,max){
  const v=parseFloat(Q.get(k));
  return isFinite(v)?clamp(v,min,max):def;
}
function qBool(k,def){
  const v=Q.get(k);
  return v===null?def:(v==="1"||v==="true");
}

const S={
  seed:  Q.get("seed") || String(Math.floor(Math.random()*1e9)),
  view:  (Q.get("view")==="space")?"space":"sky",
  kp:    Math.round(qNum("kp",3,0,9)),
  speed: qNum("speed",1,0,3),
  pitch: qNum("pitch",50,0,100),
  zoom:  qNum("zoom",1,.6,2.5),
  drift: qBool("drift",true),
  auto:  qBool("auto",true),
  field: qBool("field",true),
  flow:  qBool("flow",true),
  snow:  qBool("snow",true),
  lake:  qBool("lake",true),
  moon:  qBool("moon",false),
  labels:qBool("labels",false),

/* value-noise helper built on the seeded rng — used for curtain folds */
function makeNoise(seed){
  const rnd=mulberry32(seed), N=512, tab=new Float32Array(N);
  for(let i=0;i<N;i++) tab[i]=rnd()*2-1;
  return function(x){
    const xi=Math.floor(x), f=x-xi;
    const a=tab[((xi%N)+N)%N], b=tab[(((xi+1)%N)+N)%N];
    const t=f*f*(3-2*f);
    return a+(b-a)*t;
  };
}

const cv=document.getElementById("scene");
const ctx=cv.getContext("2d",{alpha:false});
let W=0,H=0,DPR=1,DPR_CAP=2,isPortrait=false,isMobile=false;
let dprWatch=null;

function watchDPR(){
  if(dprWatch) dprWatch.removeEventListener("change",onDprChange);
  dprWatch=window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
  dprWatch.addEventListener("change",onDprChange);
}
function onDprChange(){ watchDPR(); resize(); }

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,DPR_CAP);
  W=window.innerWidth; H=window.innerHeight;
  isPortrait=H>W; isMobile=Math.min(W,H)<700;
  if(isMobile) perf.coronaScale=0;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStarLayer();
  buildLandscape();
  buildFieldLines();
  buildCurtains();
  sizeOffscreens();
}

/* ---------------------------------------------------------------
   5. pre-rendered sprites (offscreen canvases, never built per frame)
   --------------------------------------------------------------- */
function mkCanvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h));
  return c;
}
/* radial glow sprite */
function glowSprite(size,stops){
  const c=mkCanvas(size,size), g=c.getContext("2d");
  const r=size/2, grad=g.createRadialGradient(r,r,0,r,r,r);
  for(const s of stops) grad.addColorStop(s[0],s[1]);
  g.fillStyle=grad; g.fillRect(0,0,size,size);
  return c;
}
const SPR={};
function buildSprites(){
  SPR.sunCore=glowSprite(256,[[0,"rgba(255,250,232,1)"],[.28,"rgba(255,226,150,.95)"],
    [.55,"rgba(255,160,60,.42)"],[.8,"rgba(255,110,30,.12)"],[1,"rgba(255,90,20,0)"]]);
  SPR.sunHalo=glowSprite(512,[[0,"rgba(255,196,110,.42)"],[.35,"rgba(255,150,60,.18)"],
    [.7,"rgba(255,110,40,.05)"],[1,"rgba(255,90,20,0)"]]);
  SPR.dot=glowSprite(32,[[0,"rgba(255,255,255,1)"],[.35,"rgba(255,255,255,.6)"],[1,"rgba(255,255,255,0)"]]);
  SPR.soft=glowSprite(128,[[0,"rgba(255,255,255,.7)"],[.5,"rgba(255,255,255,.16)"],[1,"rgba(255,255,255,0)"]]);
  SPR.flake=glowSprite(16,[[0,"rgba(255,255,255,1)"],[.45,"rgba(255,255,255,.55)"],[1,"rgba(255,255,255,0)"]]);
  /* solar-wind streak: bright head on the right, long tapering tail leftward */
  {
    const w=96,h=10,c=mkCanvas(w,h),g=c.getContext("2d");
    const grad=g.createLinearGradient(0,0,w,0);
    grad.addColorStop(0,"rgba(150,200,255,0)");
    grad.addColorStop(.55,"rgba(165,210,255,.28)");
    grad.addColorStop(.86,"rgba(190,225,255,.75)");
    grad.addColorStop(1,"rgba(235,246,255,1)");
    g.fillStyle=grad; g.fillRect(0,0,w,h);
    /* soften top and bottom so overlapping streaks fuse into a stream */
    const v=g.createLinearGradient(0,0,0,h);
    v.addColorStop(0,"rgba(0,0,0,1)"); v.addColorStop(.5,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,1)");
    g.globalCompositeOperation="destination-out";
    g.fillStyle=v; g.fillRect(0,0,w,h);
    SPR.streak=c;
  }

  {
    const s=96,c=mkCanvas(s,s),g=c.getContext("2d");
    const r=s/2;
    const grad=g.createRadialGradient(r*.82,r*.82,r*.1,r,r,r);
    grad.addColorStop(0,"#f4f2e9"); grad.addColorStop(.75,"#d8d6cc"); grad.addColorStop(1,"#b9b8b0");
    g.fillStyle=grad; g.beginPath(); g.arc(r,r,r*.96,0,TAU); g.fill();
    const rnd=mulberry32(0x300d);
    g.fillStyle="rgba(140,140,135,.30)";
    for(let i=0;i<9;i++){
      const a=rnd()*TAU, rr=Math.sqrt(rnd())*r*.7;
      const cx=r+Math.cos(a)*rr, cy=r+Math.sin(a)*rr;
      g.beginPath(); g.arc(cx,cy,r*(.05+rnd()*.10),0,TAU); g.fill();

  }
